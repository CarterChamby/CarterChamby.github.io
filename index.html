// ════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════
let activeBook = 'gospels';
let activeGospel = 'matthew';
let activeSec = GOSPELS[0].id;
let searchTerm = '';
let activeVerseCat = 'All';

// ════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════
function currentData() {
  switch (activeBook) {
    case 'gospels': return GOSPELS;
    case 'acts': return ACTS;
    case 'paul': return PAUL;
    case 'general': return GENERAL;
    case 'revelation': return REVELATION;
    default: return GOSPELS;
  }
}

function hl(text) {
  if (!searchTerm) return text;
  const re = new RegExp('(' + searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

function badgeHTML(badge) {
  if (!badge) return '';
  const map = { disc: ['badge-disc','Discourse'], narr: ['badge-narr','Narrative'], ot: ['badge-ot','OT Focus'], salv: ['badge-salv','Salvation'], chrst: ['badge-chrst','Christology'], church: ['badge-church','The Church'], escht: ['badge-escht','Eschatology'], prac: ['badge-prac','Practice'] };
  if (!map[badge]) return '';
  return `<span class="badge ${map[badge][0]}">${map[badge][1]}</span>`;
}

// ════════════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════════════
function renderAll() {
  renderBookBtns();
  renderLegend();
  renderSectionNav();
  renderList();
}

function renderBookBtns() {
  document.getElementById('btnGospels').className = 'book-btn' + (activeBook === 'gospels' ? ' active' : '');
  document.getElementById('btnActs').className = 'book-btn' + (activeBook === 'acts' ? ' active' : '');
  document.getElementById('btnPaul').className = 'book-btn' + (activeBook === 'paul' ? ' active' : '');
  document.getElementById('btnGen').className = 'book-btn' + (activeBook === 'general' ? ' active' : '');
  document.getElementById('btnRev').className = 'book-btn' + (activeBook === 'revelation' ? ' active' : '');
}

function gospelSections() {
  switch (activeGospel) {
    case 'matthew': return GOSPELS.filter(s => /^m\d/.test(s.id));
    case 'mark':    return GOSPELS.filter(s => s.id.startsWith('mk'));
    case 'luke':    return GOSPELS.filter(s => s.id.startsWith('lk'));
    case 'john':    return GOSPELS.filter(s => s.id.startsWith('jn'));
    default:        return GOSPELS.filter(s => /^m\d/.test(s.id));
  }
}

function selectGospel(gospel) {
  activeGospel = gospel;
  activeSec = gospelSections()[0].id;
  document.getElementById('listArea').scrollTop = 0;
  renderLegend();
  renderSectionNav();
  renderList();
}

function renderLegend() {
  document.getElementById('legendBar').style.display =
    activeBook === 'gospels' && !searchTerm ? 'flex' : 'none';
  document.getElementById('paulLegendBar').style.display =
    activeBook === 'paul' && !searchTerm ? 'flex' : 'none';
}

function renderSectionNav() {
  const nav = document.getElementById('sectionNav');
  const gospelNav = document.getElementById('gospelNav');
  if (searchTerm) {
    nav.innerHTML = '';
    gospelNav.style.display = 'none';
    return;
  }
  if (activeBook === 'gospels') {
    gospelNav.style.display = 'flex';
    gospelNav.innerHTML = ['matthew','mark','luke','john'].map(g => {
      const label = g.charAt(0).toUpperCase() + g.slice(1);
      return `<button class="gospel-tab${g === activeGospel ? ' active' : ''}" onclick="selectGospel('${g}')">${label}</button>`;
    }).join('');
    const secs = gospelSections();
    nav.innerHTML = secs.map(s =>
      `<button class="sec-tab${s.id === activeSec ? ' active' : ''}" onclick="selectSec('${s.id}')">${s.name}</button>`
    ).join('');
  } else {
    gospelNav.style.display = 'none';
    const data = currentData();
    nav.innerHTML = data.map(s =>
      `<button class="sec-tab${s.id === activeSec ? ' active' : ''}" onclick="selectSec('${s.id}')">${s.name}</button>`
    ).join('');
  }
}

function cardHTML(ch, showBookLabel) {
  return `<div class="card" onclick="toggleCard(this)">
    <div class="card-head">
      <div class="card-num">${ch.n}</div>
      <div class="card-main">
        ${ch.badge ? `<div class="badges">${badgeHTML(ch.badge)}</div>` : ''}
        <div class="card-title">${hl(ch.t)}</div>
        <div class="card-summary">${hl(ch.s)}</div>
      </div>
      <svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="card-body">
      <div class="detail-section">
        <div class="detail-label">Key arguments & themes</div>
        ${ch.args.map(a => `<div class="arg-item"><div class="arg-dot"></div><div class="arg-text">${hl(a)}</div></div>`).join('')}
      </div>
      ${ch.ot ? `<div class="ot-section"><strong style="display:block;margin-bottom:4px;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;opacity:0.8;">OT Connections</strong>${hl(ch.ot)}</div>` : ''}
      ${ch.v ? `<div class="key-verse">${hl(ch.v)}</div>` : ''}
    </div>
  </div>`;
}

function previewText(t, n) {
  n = n || 15;
  const w = t.split(/\s+/);
  return w.length > n ? w.slice(0, n).join(' ') + '…' : t;
}

function isApol(cat) { return cat && cat.toLowerCase().startsWith('apologetics'); }

function toggleVerseCard(card) { card.classList.toggle('open'); }

function selectVerseCat(cat) { activeVerseCat = cat; renderList(); }

function verseCardHTML(v) {
  const apol = isApol(v.cat);
  const cardCls = apol ? 'verse-card apol-card' : 'verse-card';
  const badgeCls = apol ? 'blue' : 'gold';
  const preview = previewText(v.text);
  const crChips = (v.crossrefs || []).map(r => `<span class="crossref-chip">${r}</span>`).join('');
  return `<div class="${cardCls}" onclick="toggleVerseCard(this)">
    <div class="verse-card-head">
      <div class="verse-card-meta">
        <div class="verse-card-top"><span class="verse-cat-badge ${badgeCls}">${v.cat}</span></div>
        <div class="verse-card-ref">${hl(v.ref)}</div>
        <div class="verse-card-preview">${hl(preview)}</div>
      </div>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="verse-card-body">
      <div class="verse-detail-section">
        <div class="verse-detail-label">Full Text — ESV</div>
        <div class="verse-full-text">${hl(v.text)}</div>
      </div>
      ${v.context ? `<div class="verse-detail-section"><div class="verse-detail-label">Context</div><div class="verse-detail-text">${hl(v.context)}</div></div>` : ''}
      ${v.background ? `<div class="verse-detail-section"><div class="verse-detail-label">Background</div><div class="verse-detail-text">${hl(v.background)}</div></div>` : ''}
      ${v.theology ? `<div class="verse-detail-section"><div class="verse-detail-label">Theological Significance</div><div class="verse-detail-text">${hl(v.theology)}</div></div>` : ''}
      ${crChips ? `<div class="verse-detail-section"><div class="verse-detail-label">Cross-References</div><div class="crossref-chips">${crChips}</div></div>` : ''}
      ${v.apologetics ? `<div class="verse-apol-block"><div style="font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--blue);margin-bottom:6px;">Apologetics</div><div style="font-size:13px;color:var(--text1);line-height:1.6;">${hl(v.apologetics)}</div></div>` : ''}
      ${v.misuse ? `<div class="verse-misuse-block"><strong style="display:block;margin-bottom:4px;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;opacity:0.8;">Common Misuse / Objection</strong>${hl(v.misuse)}</div>` : ''}
      ${v.transNote ? `<div class="verse-trans-block"><strong style="display:block;margin-bottom:4px;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;opacity:0.8;">Translation Note</strong>${hl(v.transNote)}</div>` : ''}
    </div>
  </div>`;
}

function renderList() {
  const area = document.getElementById('listArea');
  if (searchTerm) {
    const t = searchTerm.toLowerCase();
    const matchedVerses = VERSE_DB.filter(v => {
      const combined = [v.ref, v.text, v.context||'', v.background||'', v.theology||'', v.apologetics||'', v.misuse||'', v.transNote||''].join(' ').toLowerCase();
      return combined.includes(t);
    });
    const cats = ['All', ...new Set(matchedVerses.map(v => v.cat))];
    if (!cats.includes(activeVerseCat)) activeVerseCat = 'All';
    const filteredVerses = activeVerseCat === 'All' ? matchedVerses : matchedVerses.filter(v => v.cat === activeVerseCat);
    const allBooks = [...GOSPELS, ...ACTS, ...PAUL, ...GENERAL, ...REVELATION];
    let chapHTML = '', chapCount = 0;
    allBooks.forEach(sec => {
      let secHTML = '';
      sec.chapters.forEach(ch => {
        const combined = (ch.t+' '+ch.s+' '+ch.args.join(' ')+(ch.ot||'')+(ch.v||'')).toLowerCase();
        if (combined.includes(t)) { secHTML += cardHTML(ch, false); chapCount++; }
      });
      if (secHTML) chapHTML += `<div class="result-book-label">${sec.name}</div>${secHTML}`;
    });
    let html = '';
    if (matchedVerses.length) {
      const filterBar = cats.map(c => {
        const active = c === activeVerseCat;
        const cls = active ? (isApol(c) ? 'cat-chip active-blue' : 'cat-chip active') : 'cat-chip';
        return `<button class="${cls}" onclick="selectVerseCat('${c.replace(/'/g,"\\'")}')">${c}</button>`;
      }).join('');
      html += `<div class="verse-section-label">ESV — ${matchedVerses.length} verse${matchedVerses.length>1?'s':''} matching "${searchTerm}"</div>`;
      html += `<div class="verse-filter-bar">${filterBar}</div>`;
      html += filteredVerses.map(verseCardHTML).join('');
    }
    if (chapCount) {
      html += `<div class="summary-section-label">Summary tabs — ${chapCount} chapter${chapCount>1?'s':''} across all books</div>`;
      html += chapHTML;
    }
    if (!matchedVerses.length && !chapCount) {
      html = `<div class="no-results">No results for "${searchTerm}"</div>`;
    }
    area.innerHTML = html;
    return;
  }
  activeVerseCat = 'All';
  const pool = activeBook === 'gospels' ? gospelSections() : currentData();
  const sec = pool.find(s => s.id === activeSec) || pool[0];
  if (!sec) return;
  area.innerHTML = `<div class="section-label">${sec.meta}</div>` + sec.chapters.map(ch => cardHTML(ch, false)).join('');
}

// ════════════════════════════════════════════════
//  INTERACTIONS
// ════════════════════════════════════════════════
function switchBook(book) {
  activeBook = book;
  if (book === 'gospels') {
    activeGospel = 'matthew';
    activeSec = GOSPELS[0].id;
  } else {
    activeSec = currentData()[0].id;
  }
  searchTerm = '';
  document.getElementById('searchInput').value = '';
  renderAll();
}

function selectSec(id) {
  activeSec = id;
  document.getElementById('listArea').scrollTop = 0;
  renderSectionNav();
  renderList();
  // scroll the tab into view
  const tab = document.querySelector(`.sec-tab.active`);
  if (tab) tab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

function onSearch() {
  searchTerm = document.getElementById('searchInput').value.trim();
  renderAll();
}

function toggleCard(card) {
  card.classList.toggle('open');
}

// init
renderAll();
</script>
</body>
</html>
