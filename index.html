      {n:11,t:"Triumphal Entry, Fig Tree & Temple Cleansing",badge:"narr",s:"Jesus enters Jerusalem on a colt. He looks around the temple and leaves — then returns the next day to cleanse it. The fig tree cursed on the way there is found withered on the way back. Faith, prayer, and forgiveness. The question about authority.",args:["The colt: 'The Lord needs it' — a prearranged sign or a display of divine foreknowledge","Hosanna — Blessed is he who comes in the name of the Lord; blessed is the coming kingdom of our father David","Jesus enters the temple, looks around at everything, and since it was late he went out — a deliberate pause before judgment","The fig tree cursed the next morning: leaves but no fruit — a living parable of Israel's religious facade","Temple cleansing: 'a house of prayer for all nations' (Isa 56:7) — 'den of robbers' (Jer 7:11); the chief priests look for a way to kill him","The fig tree found withered: 'Have faith in God' — whoever says to this mountain 'go throw yourself into the sea' and believes will have it done","Authority question: was John's baptism from heaven or from men? They cannot answer; neither will Jesus answer them"],ot:"Ps 118:25-26 (Hosanna, blessed is he who comes); Isa 56:7 (house of prayer for all nations); Jer 7:11 (den of robbers); Zech 9:9 (riding on a colt)",v:"My house will be called a house of prayer for all nations (11:17)"},
      {n:12,t:"Wicked Tenants; Controversy Questions; Greatest Commandment; David's Son; The Widow's Offering",badge:"narr",s:"Parable of the wicked tenants — the stone rejected becomes the cornerstone. Taxes to Caesar. Resurrection question (Sadducees). The greatest commandment. David's son. The teachers of the law condemned. The widow's two small coins.",args:["Wicked tenants: the vineyard owner sends servants (prophets), then his son (Jesus) — they kill the son; the vineyard will be given to others","Taxes: 'Give back to Caesar what is Caesar's and to God what is God's' — they are amazed at him","Sadducees and resurrection: God is not the God of the dead but of the living — you are badly mistaken","Greatest commandment: love God with everything; love your neighbor as yourself — there is no commandment greater than these","The scribe who answers wisely: 'You are not far from the kingdom of God'","David's son: how can the Christ be both David's son and David's Lord? — the crowd listens with delight","Beware of the teachers of the law: they devour widows' houses and make lengthy prayers for show","The widow's two coins: she put in everything — all she had to live on; the rich gave out of abundance"],ot:"Isa 5:1-7 (the vineyard song — the wicked tenants parable background); Ps 118:22-23 (the rejected stone becomes the cornerstone); Deut 6:4-5 (the Shema — the greatest commandment)",v:"She, out of her poverty, put in everything — all she had to live on (12:44)"},
      {n:13,t:"The Olivet Discourse",badge:"disc",s:"Not one stone will be left on another. Signs of the end: false Christs, wars, persecution, family betrayal, the abomination of desolation, the coming of the Son of Man. No one knows the day or hour — watch, be alert.",args:["Not one stone on another — the temple will be completely destroyed (fulfilled in 70 AD)","The beginning of birth pains: wars, earthquakes, famines — not yet the end","Persecution: you will be handed over to councils, flogged, stand before governors and kings; the Spirit will speak through you","Brother will betray brother to death — the family division that Jesus predicted will come","The abomination of desolation (Dan 9:27): when you see it, flee to the mountains immediately","False Christs and false prophets performing signs to deceive even the elect if possible","The Son of Man coming in clouds with great power and glory — he will send the angels to gather the elect","No one knows the day or hour — not the angels, not the Son, only the Father; therefore: watch"],ot:"Dan 9:27; 12:11 (abomination of desolation); Dan 7:13-14 (the Son of Man coming on clouds); Isa 13:10; 34:4 (cosmic signs)",v:"But about that day or hour no one knows, not even the angels in heaven, nor the Son, but only the Father (13:32)"},
    ]
  },
  {
    id:"mk4", name:"Passion & Resurrection (14–16)",
    meta:"The anointing, Last Supper, Gethsemane, arrest, trial, crucifixion — and the abrupt, unsettling ending: they fled and said nothing, for they were afraid",
    chapters:[
      {n:14,t:"Anointing, Last Supper, Gethsemane & Arrest",badge:"narr",s:"Two days before Passover. The anointing at Bethany. Judas agrees to betray Jesus. The Last Supper. Gethsemane — 'Abba, Father, everything is possible for you. Take this cup from me. Yet not what I will, but what you will.' The arrest.",args:["The anointing: wherever the gospel is preached, what she has done will be told in memory of her — a prophecy embedded in the passion story","The Last Supper: 'This is my body / This is my blood of the covenant poured out for many'","The new covenant inaugurated: 'I will not drink again from the fruit of the vine until that day when I drink it new in the kingdom of God'","Gethsemane: 'Abba, Father' — the Aramaic address is preserved; the most intimate address to God in the NT; three times he prays the same prayer","The disciples sleep three times — they cannot watch one hour","The arrest: a crowd with swords and clubs; Judas's kiss as the signal; the young man who fled naked (possibly Mark himself)","Before the Sanhedrin: the false witnesses disagree; 'Are you the Messiah?' — 'I am'; you will see the Son of Man sitting at the right hand of Power","Peter's three denials — 'I don't know this man you're talking about'; the rooster crows; Peter breaks down and weeps"],ot:"Zech 13:7 (strike the shepherd and the sheep will scatter — Jesus quotes this at the Last Supper); Dan 7:13 (the Son of Man at the right hand of Power — Jesus's claim before the Sanhedrin)",v:"Abba, Father, everything is possible for you. Take this cup from me. Yet not what I will, but what you will (14:36)"},
      {n:15,t:"Trial, Crucifixion & Death",badge:"narr",s:"Jesus before Pilate — he is silent before his accusers. Barabbas released. Simon of Cyrene carries the cross. The crucifixion. The mocking. Darkness at noon. 'Eloi, Eloi, lema sabachthani.' The temple veil tears. The centurion confesses.",args:["Jesus before Pilate: Pilate is amazed he gives no answer — the silence of the Servant (Isa 53:7)","Barabbas: an insurrectionist and murderer released; the innocent one given over","Simon of Cyrene: named with his sons (Alexander and Rufus) — they were probably known to Mark's Roman audience","'King of the Jews': the charge written on the cross is ironically true","The mocking: those passing by wagging their heads; 'Come down from the cross and we will believe' — Ps 22:7-8 fulfilled","Darkness from noon to 3pm — cosmic sign; then the cry of dereliction: Ps 22:1","The temple veil torn in two from top to bottom — access to God's presence opened","The centurion: 'Surely this man was the Son of God!' — a Roman soldier makes the confession the disciples have failed to make","The women watching from a distance — faithful when the male disciples have fled"],ot:"Ps 22 (entire crucifixion scene — forsaken, mocked, garments divided, wagging heads); Isa 53:7 (silent before his accusers); Amos 8:9 (darkness at noon)",v:"Surely this man was the Son of God! (15:39)"},
      {n:16,t:"The Resurrection",badge:"narr",s:"Three women come to the tomb on Sunday morning. A young man in white: 'He has risen! He is not here.' They are told to tell the disciples — but they flee and say nothing to anyone, for they were afraid. (The longer ending 16:9-20 is a later addition not in the earliest manuscripts.)",args:["Three women come to anoint the body — 'Who will roll the stone away?' — the stone is already rolled away","The young man in white: 'You are looking for Jesus the Nazarene, who was crucified. He has risen!'","'He is going ahead of you into Galilee. There you will see him, just as he told you.'","The original ending (v.8): they fled and said nothing to anyone, for they were afraid — a deliberately unsettling ending that throws the mission back to the reader","The abrupt ending may be intentional: the story is not over; the reader must now carry the mission","Note on 16:9-20: most scholars and modern translations indicate this longer ending is a later addition — it summarizes resurrection appearances found in other gospels"],v:"He has risen! He is not here. See the place where they laid him (16:6)"},
    ]
  },
  {
    id:"lk1", name:"Birth & Early Ministry (1–5)",
    meta:"Luke's careful prologue, the birth narratives of John and Jesus, the Magnificat, Simeon's Nunc Dimittis, and the calling of the first disciples",
    chapters:[
      {n:1,t:"The Prologue; Angel Visits to Zechariah and Mary; The Magnificat",badge:"ot",s:"Luke states his purpose: an orderly account for Theophilus. The angel Gabriel announces John's birth to Zechariah and Jesus's birth to Mary. Mary visits Elizabeth — the baby leaps in the womb. Mary's Magnificat. John is born and Zechariah sings the Benedictus.",args:["Luke's prologue (1:1-4): the most literary opening in the NT — an eyewitness-based, carefully investigated account; Luke is writing history","Zechariah and Elizabeth: righteous, blameless, old and childless — the Abraham and Sarah pattern","Gabriel: John will be great before the Lord; filled with the Holy Spirit from birth; go in the spirit and power of Elijah","The Annunciation: 'Greetings, you who are highly favored! The Lord is with you' — Mary is troubled","The Magnificat: Mary's song echoes Hannah's song (1 Sam 2) — the mighty scattered, the humble lifted, the hungry filled, the rich sent away empty","The Benedictus: Zechariah's song at John's birth — salvation from the house of David; the tender mercy of God; the dawn from on high will visit us","Both songs celebrate the reversal of the powerful and the weak — the keynote of Luke's entire gospel"],ot:"1 Sam 1-2 (Hannah's song — the direct model for the Magnificat); Isa 7:14 (a virgin will conceive); Mal 4:5-6 (the spirit and power of Elijah)",v:"He has brought down rulers from their thrones but has lifted up the humble. He has filled the hungry with good things but has sent the rich away empty (1:52-53)"},
      {n:2,t:"Birth, Shepherds, Simeon & Anna; The Boy Jesus in the Temple",badge:"ot",s:"Jesus is born in Bethlehem during a census. The angels appear to shepherds — the first evangelists are the social outcasts of Jewish society. Simeon's Nunc Dimittis: 'A light of revelation to the Gentiles.' Anna the prophetess. The twelve-year-old Jesus in the temple.",args:["The census setting: Jesus born under the political machinery of Rome — the universal Savior enters under universal imperial authority","Shepherds: despised in 1st century Jewish society, considered unreliable witnesses — yet they are the first to hear the announcement","The angels' song: 'Glory to God in the highest, and on earth peace to those on whom his favor rests'","Simeon: the Holy Spirit had revealed he would not die before seeing the Lord's Christ; 'My eyes have seen your salvation... a light for revelation to the Gentiles'","Simeon to Mary: 'A sword will pierce your own soul too' — the cross foreshadowed at the cradle","Anna the prophetess: 84 years old, fasting and praying; gives thanks and speaks about the child to all who were looking for Jerusalem's redemption — a woman is among the first preachers","Jesus at twelve: 'Did you not know that I must be in my Father's house?' — the first words of Jesus in Luke; his self-awareness of divine sonship"],ot:"Isa 42:6; 49:6 (light to the Gentiles — Simeon quotes these at the presentation); Mal 3:1 (the Lord coming suddenly to his temple)",v:"My eyes have seen your salvation, which you have prepared in the sight of all nations: a light for revelation to the Gentiles, and the glory of your people Israel (2:30-32)"},
      {n:3,t:"John the Baptist; Genealogy of Jesus",badge:"ot",s:"John preaches repentance in the fifteenth year of Tiberius. His social ethics: share your clothes and food; tax collectors don't collect more; soldiers don't extort. Jesus is baptized. The genealogy traces Jesus back to Adam — the son of God.",args:["The historical anchoring: the fifteenth year of Tiberius Caesar, with Pilate, Herod, Annas, and Caiaphas all named — Luke insists this is history","John's social ethics: unique to Luke — 'Anyone who has two shirts should share with the one who has none'","Tax collectors baptized: 'Don't collect any more than you are required to'; soldiers: 'Don't extort money'","John's comparison: I baptize with water; he will baptize with the Holy Spirit and fire — the winnowing fork is in his hand","The baptism: the Spirit descends in bodily form like a dove; the voice from heaven: 'You are my Son, whom I love'","The genealogy in Luke goes from Jesus back to Adam — not forward from Abraham (Matthew's direction); Jesus is the Savior of all humanity, not just Israel","The genealogy ends: 'the son of Adam, the son of God' — connecting Jesus to humanity and to God simultaneously"],ot:"Isa 40:3-5 (all flesh will see God's salvation — Luke extends the Isaiah quote further than Matthew and Mark, emphasizing universality); Mal 4:1 (the fire of judgment)",v:"And all people will see God's salvation (3:6)"},
      {n:4,t:"Temptation; Nazareth Rejection; Capernaum Ministry",badge:"narr",s:"The temptation in the wilderness (Luke's order differs from Matthew's — ending with the pinnacle of the temple in Jerusalem, the goal of the whole gospel). Jesus reads Isaiah 61 in the Nazareth synagogue — 'Today this Scripture is fulfilled in your hearing.' They try to throw him off a cliff.",args:["Luke's temptation order: bread, kingdoms, pinnacle of the temple — the Jerusalem climax fits Luke's geographic purpose","The devil leaves him 'until an opportune time' — Luke explicitly notes Satan departs only temporarily (contrast Matthew and Mark)","Nazareth synagogue: 'The Spirit of the Lord is on me, because he has anointed me to proclaim good news to the poor' (Isa 61:1-2)","The year of the Lord's favor — he stops reading before the line about the day of vengeance; the kingdom is first grace, then judgment","'Today this scripture is fulfilled in your hearing' — the most explicit claim to fulfillment in any synagogue scene","The hometown crowd: initially favorable, then furious when Jesus cites Elijah going to a Gentile widow and Elisha healing a Syrian","They drive him to the brow of a hill to throw him off — he passes through the crowd and goes on his way"],ot:"Isa 61:1-2 (the Spirit of the Lord anointed me — read in the Nazareth synagogue and claimed as fulfilled); Deut 8:3; 6:13; 6:16 (Jesus's responses to the three temptations)",v:"Today this scripture is fulfilled in your hearing (4:21)"},
      {n:5,t:"The Call of Peter; Leper, Paralytic & Levi",badge:"narr",s:"The miraculous catch of fish — Peter falls at Jesus's knees: 'Go away from me, Lord; I am a sinful man.' Healing of a leper. The paralytic lowered through the roof. Levi called. Eating with tax collectors and sinners. Old and new wineskins.",args:["The miraculous catch: Jesus teaches from Peter's boat; then 'Put out into deep water'; the nets begin to break; two boats begin to sink","Peter's response is worship and self-condemnation together — 'Go away from me, Lord; I am a sinful man'","'From now on you will fish for people' — the call is rooted in the miracle; the miracle interprets the mission","The leper: 'Lord, if you are willing, you can make me clean' — Jesus reaches out and touches him: 'I am willing'","The paralytic: 'Friend, your sins are forgiven' — the Pharisees charge blasphemy; Jesus heals to prove his authority","Levi at his tax booth: 'Follow me'; he leaves everything and follows","Old wineskins: the new covenant requires new structures — you cannot patch old cloth with unshrunk fabric"],v:"Don't be afraid; from now on you will fish for people (5:10)"},
    ]
  },
  {
    id:"lk2", name:"Galilean Ministry (6–9)",
    meta:"The Sermon on the Plain, raising the widow's son, the sinful woman forgiven, the transfiguration, and Jesus setting his face toward Jerusalem",
    chapters:[
      {n:6,t:"Sabbath Controversies; The Twelve; Sermon on the Plain",badge:"disc",s:"Two Sabbath controversies. Jesus prays all night and chooses the Twelve. The Sermon on the Plain — Luke's parallel to the Sermon on the Mount, shorter and more socially radical: four beatitudes and four woes. Love your enemies. The two builders.",args:["Sabbath controversies: the grain field and the withered hand — 'The Son of Man is Lord of the Sabbath'","All night in prayer before choosing the Twelve — prayer before every major decision is a Lukan pattern","The four beatitudes: 'Blessed are you who are poor / hungry / weep / are hated' — addressed directly to disciples ('you'), not as character descriptions","The four woes: unique to Luke — 'Woe to you who are rich / well fed / laugh / are spoken well of'","Love your enemies: do good to those who hate you; lend without expecting anything back; be merciful as your Father is merciful","Do not judge and you will not be judged — the plank and the speck","The two builders: on rock vs. sand — 'when a flood came, the torrent struck that house' (Luke adds the flood element)"],v:"But love your enemies, do good to them, and lend to them without expecting to get anything back (6:35)"},
      {n:7,t:"The Centurion; Widow of Nain; John's Question; The Sinful Woman",badge:"narr",s:"The centurion's faith — 'I did not even consider myself worthy to come to you.' The widow of Nain's son raised — 'God has come to help his people.' John the Baptist's question from prison. Jesus on John. The sinful woman anoints Jesus's feet — 'Her many sins have been forgiven.'",args:["The centurion: a Gentile, he sends Jewish elders to plead for him; 'I did not consider myself worthy'; Jesus marvels at his faith — 'I have not found such great faith even in Israel'","The widow of Nain: Luke alone records this; Jesus sees her and has compassion unprompted — he touches the bier; 'Young man, I say to you, get up!'","'God has come to help his people' — the crowd's response echoes OT visitations of God","John's question: 'Are you the one who is to come, or should we expect someone else?' — Jesus answers with Isa 35/61","Jesus on John: no one born of women is greater than John; yet the one who is least in the kingdom is greater","The sinful woman: she weeps, her tears wet Jesus's feet, she wipes them with her hair, kisses them, pours perfume","Simon the Pharisee thinks silently: 'If this man were a prophet, he would know who is touching him'","The two debtors parable: the one forgiven more loves more; 'Your sins are forgiven... your faith has saved you'"],ot:"Isa 35:5-6; 61:1 (Jesus's answer to John — the messianic works); 1 Kgs 17:23 (Elijah raises the widow's son — the Nain miracle is deliberately parallel)",v:"Therefore, I tell you, her many sins have been forgiven — as her great love has shown (7:47)"},
      {n:8,t:"Women Supporters; Parables; Storm; Gerasene; Jairus",badge:"narr",s:"Women who supported Jesus from their own means — unique to Luke. The parable of the sower. The lamp. 'My mother and brothers are those who hear God's word and put it into practice.' The stilling of the storm. The Gerasene demoniac. Jairus's daughter and the hemorrhaging woman.",args:["The women: Mary Magdalene, Joanna (wife of Herod's household manager), Susanna, and many others — they are supporting the mission financially; Luke names women where other gospels don't","The sower and soils: the seed is the word of God; the thorns are life's worries, riches, and pleasures","True family: 'My mother and brothers are those who hear God's word and put it into practice'","The storm: 'Where is your faith?' — 'Who is this? He commands even the winds and water, and they obey him'","The Gerasene: sent back to 'tell how much God has done for you' — the Gentile evangelist; he tells about Jesus","Jairus: a synagogue leader; his daughter is dying; on the way, the hemorrhaging woman healed","'Talitha koum' equivalent in Luke: 'My child, get up!' — her spirit returned; Jesus orders them to give her something to eat"],v:"My mother and brothers are those who hear God's word and put it into practice (8:21)"},
      {n:9,t:"Mission of the Twelve; Feeding 5000; Peter's Confession; Transfiguration; Third Passion Prediction",badge:"narr",s:"The Twelve sent out. Herod's perplexity about Jesus. The feeding of the five thousand. Peter's confession. The cost of discipleship. The transfiguration — Moses and Elijah speak about his 'departure' (exodus). The disciples argue about greatness.",args:["Luke adds: Moses and Elijah 'spoke about his departure (exodus), which he was about to bring to fulfillment at Jerusalem' — the transfiguration is interpreted through the lens of the exodus","Peter's confession: 'God's Messiah' — Jesus commands them not to tell anyone (messianic secret)","The cost: 'Whoever wants to be my disciple must deny themselves and take up their cross daily and follow me' — Luke adds 'daily'","What does it profit a man to gain the whole world and lose himself?","The disciples argue about greatness immediately after the second passion prediction — the irony is pointed","'Whoever is least among you all is the greatest' — the child placed beside Jesus as the object lesson","'Whoever is not against you is for you' — a more generous boundary than might be expected","From here: Luke's long travel narrative begins (9:51–19:44) — 'Jesus resolutely set his face toward Jerusalem'"],ot:"Exod 19 / Deut 18 (the transfiguration setting and voice echo Sinai); the word 'departure/exodus' is deliberate — Jesus is the new Moses leading the true exodus",v:"As the time approached for him to be taken up to heaven, Jesus resolutely set out for Jerusalem (9:51)"},
    ]
  },
  {
    id:"lk3", name:"The Travel Narrative (10–15)",
    meta:"Luke's unique journey section: the Good Samaritan, Mary and Martha, the Lord's Prayer, the Prodigal Son, and the lost sheep — Jesus teaching on the road to Jerusalem",
    chapters:[
      {n:10,t:"The Seventy-Two Sent; The Good Samaritan; Mary and Martha",badge:"disc",s:"Jesus sends out seventy-two — the mission expands beyond the Twelve. Woes on Chorazin and Bethsaida. The lawyer's question leads to the Good Samaritan parable. Mary and Martha: 'Mary has chosen what is better.'",args:["The seventy-two: unique to Luke; 70 or 72 nations in Jewish tradition — this mission previews the universal Gentile mission","The harvest is plentiful, workers are few — pray for laborers","Their return: 'Lord, even the demons submit to us in your name!' — 'I saw Satan fall like lightning from heaven'","The lawyer's question: 'Who is my neighbor?' — the parable deconstructs the question; the question should be 'Am I being a neighbor?'","The Good Samaritan: a priest passes, a Levite passes — the hated half-breed stops, pays, promises to return; 'Go and do likewise'","Mary and Martha: Martha distracted by all the preparations; Mary sits at the Lord's feet and listens","'Mary has chosen what is better, and it will not be taken away from her' — Jesus defends a woman's right to be a disciple"],v:"Go and do likewise (10:37)"},
      {n:11,t:"The Lord's Prayer; Persistent Prayer; Beelzebul; Sign of Jonah; Woes on Pharisees",badge:"disc",s:"The disciples ask Jesus to teach them to pray — the Lord's Prayer in its Lukan form. The friend at midnight — persistence in prayer. The Beelzebul controversy. No sign but Jonah. The lamp. Six woes on the Pharisees and lawyers.",args:["The Lord's Prayer in Luke: shorter than Matthew's version; given in response to a disciple's request — a prayer to be prayed, not just admired","The friend at midnight: the parable is about shameless persistence — he gets up not out of friendship but because of the man's audacity","Ask, seek, knock: how much more will your Father give the Holy Spirit to those who ask! — Luke's version replaces 'good gifts' with 'the Holy Spirit'","The Beelzebul: if Satan is divided against himself, how can his kingdom stand? But if I drive out demons by the finger of God, the kingdom has come to you","Six woes on the Pharisees: tithing mint and rue while neglecting justice and love; you love the prominent seats; you are unmarked graves","Six woes on the lawyers (teachers of the law): you load people down with burdens; you build tombs for the prophets your ancestors killed; you took away the key to knowledge"],v:"If you then, though you are evil, know how to give good gifts to your children, how much more will your Father in heaven give the Holy Spirit to those who ask him! (11:13)"},
      {n:12,t:"Fear God Not Man; Wealth Warnings; Watchfulness",badge:"disc",s:"Don't be afraid of those who can only kill the body. The sin against the Holy Spirit. Parable of the rich fool — 'You fool! This very night your life will be demanded from you.' Don't worry. Seek his kingdom. The faithful servant. Division, not peace.",args:["Fear him who can destroy both soul and body — but even the hairs of your head are numbered; do not be afraid","Whoever disowns me before men will be disowned before the angels of God","The sin against the Holy Spirit: blasphemy against the Spirit will not be forgiven — the Spirit will teach you what to say in the moment of persecution","The rich fool: a man whose land produced abundantly; 'I will tear down my barns and build bigger ones'; 'You fool! This very night your life will be demanded' — unique to Luke","Do not set your heart on what you will eat or drink — your Father knows you need them; seek his kingdom and these things will be given","Sell your possessions and give to the poor — provide purses that will not wear out, a treasure in heaven that will not be exhausted","The faithful servant: the master returns at an unexpected hour; blessed is the servant found doing his duty","Do you think I came to bring peace on earth? No, I tell you, but division — fire of judgment before final peace"],v:"Watch out! Be on your guard against all kinds of greed; life does not consist in an abundance of possessions (12:15)"},
      {n:13,t:"Repent or Perish; The Barren Fig Tree; Mustard Seed; The Narrow Door; Jerusalem Lament",badge:"disc",s:"Galileans killed by Pilate and the eighteen killed by the falling tower — unless you repent, you too will perish. The barren fig tree given one more year. Healing a crippled woman on the Sabbath. The mustard seed and yeast. The narrow door. Jerusalem, Jerusalem.",args:["The Galileans and the tower: suffering is not proof of greater sinfulness — but it is a call to repentance for all","The barren fig tree: the gardener pleads for one more year — mercy before judgment (Israel has another chance)","The crippled woman: eighteen years bent over, unable to straighten up; Jesus heals her; the synagogue ruler is indignant — on the Sabbath","'Should not this woman, a daughter of Abraham, be set free on the Sabbath day from what bound her?' — dignity for the woman, silencing for the opponents","The narrow door: 'Make every effort to enter through the narrow door' — many will try but will not be able","'We ate and drank with you, and you taught in our streets' — familiarity with Jesus is not the same as knowing him","'Jerusalem, Jerusalem, you who kill the prophets' — the lament; 'your house is left desolate'"],v:"Make every effort to enter through the narrow door, because many, I tell you, will try to enter and will not be able to (13:24)"},
      {n:14,t:"Sabbath Healing; Humility at Banquets; The Great Banquet; Cost of Discipleship",badge:"disc",s:"Healing a man with dropsy at a Pharisee's table on the Sabbath. The parable of the seats at the banquet — take the lowest seat. The parable of the great banquet — the invited guests make excuses; the poor and crippled and blind are brought in. The cost of discipleship.",args:["Sabbath healing: 'If one of you has a son or an ox that falls into a well on the Sabbath day, will you not immediately pull it out?' — they could not reply","Seat at the banquet: do not take the place of honor; the one who humbles himself will be exalted","The guest list: do not invite your friends, brothers, relatives, or rich neighbors — invite the poor, the crippled, the lame, the blind","The great banquet: those first invited make excuses (field, oxen, married); the master sends to the poor, crippled, blind, lame; still there is room; go to the highways and hedges","The excuses: legitimate activities (business, family) can crowd out the kingdom invitation","The cost: hate father and mother (hyperbolic — love me more than all others); carry your cross; count the cost like a builder or a king","Salt that loses its saltiness: 'Whoever has ears to hear, let them hear'"],v:"Go out quickly into the streets and alleys of the town and bring in the poor, the crippled, the blind and the lame (14:21)"},
      {n:15,t:"The Lost Sheep, Lost Coin & Prodigal Son",badge:"disc",s:"Three parables of the lost — told in response to the Pharisees' muttering that Jesus welcomes sinners. The lost sheep (99 left to find one), the lost coin (search until found), and the prodigal son — the longest and richest parable in the gospels.",args:["The setting: tax collectors and sinners gather; Pharisees and scribes mutter — the audience for all three parables","The lost sheep: the shepherd leaves the 99 and searches until he finds the lost one; more rejoicing in heaven over one sinner who repents","The lost coin: the woman lights a lamp and sweeps until she finds it — heaven rejoices over one repentant sinner","The prodigal son: he demands his inheritance (wishing his father dead), wastes it in wild living, comes to his senses in a pigsty, rehearses his speech, comes home","The father sees him while he is still a great way off — he runs, falls on his neck, orders the robe and ring and sandal and fatted calf","The elder son's resentment: 'I've slaved for you and never disobeyed' — 'all that I have is yours'; 'your brother was dead and is alive'","The parable is deliberately unfinished — we do not know if the elder son goes in; the question hangs over the Pharisees listening"],v:"While he was still a long way off, his father saw him and was filled with compassion for him; he ran to his son, threw his arms around him and kissed him (15:20)"},
    ]
  },
  {
    id:"lk4", name:"Parables & Jerusalem (16–21)",
    meta:"The rich man and Lazarus, Zacchaeus, the triumphal entry, Jesus weeping over Jerusalem, and the Olivet Discourse on the temple's coming destruction",
    chapters:[
      {n:16,t:"The Shrewd Manager; The Rich Man and Lazarus",badge:"disc",s:"The parable of the shrewd manager — use worldly wealth to gain friends, so that when it is gone, you will be welcomed into eternal dwellings. You cannot serve both God and money. The Pharisees sneer. The rich man and Lazarus.",args:["The shrewd manager: commended not for dishonesty but for foresight — use money now to prepare for the future; the children of this world are shrewder in this than the children of light","Whoever can be trusted with very little can be trusted with much — faithful in the small","The Pharisees, who loved money, sneered — Jesus addresses them directly: what is exalted among men is an abomination in God's sight","The rich man and Lazarus: unique to Luke; the only parable with a named character (Lazarus)","The reversal: the rich man in torment; Lazarus in Abraham's bosom; the great chasm fixed","'If they do not listen to Moses and the Prophets, they will not be convinced even if someone rises from the dead' — the warning applies to the Pharisees"],v:"No one can serve two masters... You cannot serve both God and money (16:13)"},
      {n:17,t:"Forgiveness, Faith, Duty, Ten Lepers & the Kingdom's Coming",badge:"disc",s:"Stumbling blocks — woe to the one who causes little ones to sin. Forgive seven times a day. Faith the size of a mustard seed. We are unworthy servants. The ten lepers healed — only the Samaritan returns to give thanks. The kingdom is in your midst. The day of the Son of Man.",args:["If your brother sins, rebuke them; if they repent, forgive them — seven times in a day, seven times forgive","The disciples ask for more faith; Jesus says even mustard-seed faith can uproot a tree — the issue is not amount but authenticity","The unworthy servant: we have only done our duty — there is no merit in mere obedience","The ten lepers: healed at a distance; only the Samaritan returns and falls at Jesus's feet giving thanks; 'Was no one found to return and give praise to God except this foreigner?'","'The kingdom of God is in your midst (or within you)' — presence, not speculation, is the concern","The day of the Son of Man: like lightning, like Noah's flood, like Lot's day — sudden, unmissable, inescapable"],v:"Were not all ten cleansed? Where are the other nine? Has no one returned to give praise to God except this foreigner? (17:17-18)"},
      {n:18,t:"Persistent Widow; Pharisee & Tax Collector; Rich Young Man; Blind Beggar",badge:"disc",s:"The widow who kept coming to the judge — will God not bring justice for his chosen ones? The Pharisee and the tax collector — the latter goes home justified. Children welcomed. The rich young man. The camel and the needle. Third passion prediction. Blind Bartimaeus.",args:["The persistent widow: a judge who neither feared God nor cared about men grants her justice to stop being bothered — how much more will God act for his chosen who cry out?","The Pharisee's prayer is really a speech about himself; the tax collector beats his breast and says 'God, have mercy on me, a sinner'","'Everyone who exalts himself will be humbled, and everyone who humbles himself will be exalted'","Children: 'unless you receive the kingdom of God like a little child, you will never enter it'","The rich young man: Jesus loves him; 'one thing you still lack'; he goes away sad","The blind beggar: 'Son of David, have mercy on me!'; the crowd rebukes him; 'Jesus, Son of David, have mercy on me!'; 'Receive your sight; your faith has healed you'"],v:"God, have mercy on me, a sinner (18:13)"},
      {n:19,t:"Zacchaeus; The Ten Minas; Triumphal Entry; Temple Cleansing; Lament over Jerusalem",badge:"narr",s:"Zacchaeus the chief tax collector climbs a tree — 'Today salvation has come to this house.' The parable of the ten minas. The triumphal entry — the Pharisees tell Jesus to rebuke the disciples; the stones would cry out. Jesus weeps over Jerusalem.",args:["Zacchaeus: a chief tax collector and rich man; he is short; he runs ahead and climbs a sycamore tree; Jesus invites himself over","'Today salvation has come to this house, because this man, too, is a son of Abraham' — the social outcast is welcomed","'The Son of Man came to seek and to save the lost' — the programmatic summary of Luke's entire gospel","The ten minas: told because they thought the kingdom would appear immediately; a nobleman goes away to receive a kingdom; servants given minas to put to work; the one who did nothing has it taken away","The triumphal entry: the Pharisees want Jesus to rebuke the crowd; 'If they keep quiet, the stones will cry out'","Jesus weeps over Jerusalem: 'If you, even you, had only known on this day what would bring you peace' — unique to Luke","Temple cleansing: briefer than in Matthew and Mark; the temple is where Jesus teaches daily until the arrest"],v:"For the Son of Man came to seek and to save the lost (19:10)"},
      {n:20,t:"Authority Questioned; Wicked Tenants; Taxes; Resurrection; David's Son",badge:"narr",s:"The authority question. The wicked tenants parable. Taxes to Caesar. The Sadducees and resurrection — 'He is not the God of the dead, but of the living.' David's son. Beware the teachers of the law.",args:["Authority question: 'Tell us by what authority you are doing these things' — Jesus answers with a counter-question about John; they cannot answer","Wicked tenants: the vineyard given to others; 'the stone the builders rejected has become the cornerstone'","The scribes and chief priests want to arrest him immediately, but they fear the people","Taxes: 'Give back to Caesar what is Caesar's, and to God what is God's' — they could not trap him","The resurrection: 'He is not the God of the dead, but of the living, for to him all are alive'","Beware the teachers of the law who love greetings in the marketplaces and devour widows' houses"],ot:"Isa 5:1-7 (the vineyard song — wicked tenants background); Ps 118:22 (rejected stone); Exod 3:6 (God of Abraham — the living)",v:"He is not the God of the dead, but of the living, for to him all are alive (20:38)"},
      {n:21,t:"The Widow's Offering; Olivet Discourse",badge:"disc",s:"The widow's two coins — she gave all she had to live on. The temple's destruction predicted. Signs of the end. Jerusalem surrounded by armies. The Son of Man coming. Luke's version uniquely emphasizes Jerusalem's destruction (70 AD) before the end.",args:["The widow: contrasted with the rich giving out of abundance; she gave out of poverty — all she had to live on","Not one stone on another — when will this happen and what will be the sign?","Luke's unique addition: 'When you see Jerusalem surrounded by armies, you will know its desolation is near' — a clear reference to the 70 AD siege","Jerusalem will be trampled on by the Gentiles until the times of the Gentiles are fulfilled","Signs in the heavens; the Son of Man coming in a cloud with power and great glory","Stand firm and you will win life — watch and pray so you are not weighed down with carousing and drunkenness"],v:"When these things begin to take place, stand up and lift up your heads, because your redemption is drawing near (21:28)"},
    ]
  },
  {
    id:"lk5", name:"Passion & Resurrection (22–24)",
    meta:"The Last Supper with the servant-king discourse, Gethsemane, the penitent criminal, 'Father forgive them,' the Emmaus road, and the ascension",
    chapters:[
      {n:22,t:"The Last Supper, Gethsemane & Arrest",badge:"narr",s:"Satan enters Judas. The Last Supper — the new covenant in my blood. Argument about greatness at the table — Jesus rebukes them gently. The prediction of Peter's denial. Gethsemane — an angel strengthens Jesus; his sweat is like drops of blood. The arrest — Jesus heals the servant's ear.",args:["Satan entering Judas: Luke alone emphasizes this — the passion is the culmination of the cosmic conflict with Satan (who departed only 'until an opportune time' in ch. 4)","The institution: 'This cup is the new covenant in my blood, which is poured out for you'","The argument about greatness at the Last Supper: 'the greatest among you should be like the youngest, and the one who rules like the one who serves'","Jesus among them as one who serves — the host becomes the servant","Gethsemane: an angel appears and strengthens him; his sweat is like drops of blood falling to the ground (unique to Luke)","Jesus heals the servant's ear — the only miracle of re-attachment in the gospels; compassion even in the moment of betrayal","Jesus to the chief priests: 'This is your hour — when darkness reigns'"],v:"This cup is the new covenant in my blood, which is poured out for you (22:20)"},
      {n:23,t:"Trial, Crucifixion & Death",badge:"narr",s:"Jesus before Pilate — three times declared innocent. Before Herod — a longstanding wish fulfilled; Jesus says nothing. Simon of Cyrene. The women of Jerusalem — Jesus weeps for them. The two criminals — 'Today you will be with me in paradise.' The death. Joseph of Arimathea buries Jesus.",args:["Pilate declares Jesus innocent three times — the Roman legal finding is emphasized in Luke","Herod Antipas: 'He had been wanting to see him for a long time' (curiosity, not faith); Jesus gives him no answer; Herod mocks him; Herod and Pilate become friends that day","The women of Jerusalem: 'Do not weep for me; weep for yourselves and for your children' — judgment is coming on Jerusalem","Jesus's prayer from the cross: 'Father, forgive them, for they do not know what they are doing' — unique to Luke","The penitent criminal: 'We are getting what our deeds deserve. But this man has done nothing wrong'; 'Remember me when you come into your kingdom'","'Today you will be with me in paradise' — the immediate promise; the most personal word from the cross in any gospel","Jesus's death: 'Father, into your hands I commit my spirit' — he yields his spirit"],v:"Jesus, remember me when you come into your kingdom... Truly I tell you, today you will be with me in paradise (23:42-43)"},
      {n:24,t:"The Resurrection; Emmaus; Appearance to the Disciples; The Ascension",badge:"narr",s:"The women find the empty tomb. Peter runs to check. The Emmaus road — Jesus opens the Scriptures; he is recognized in the breaking of bread. He appears to the gathered disciples — 'Peace be with you'; he eats fish. He opens their minds to the Scriptures. He blesses them and ascends.",args:["The women: they tell the eleven; 'they did not believe the women, because their words seemed to them like nonsense' — the first witnesses are women; the disciples don't believe them","The Emmaus road: two disciples walk away in despair; Jesus joins them; they are kept from recognizing him; he interprets all the Scriptures concerning himself","Their hearts burned within them — the experience of being taught by Jesus on the road","He is recognized in the breaking of bread — and then vanishes; immediately they return to Jerusalem","Jesus appears to the gathered disciples: 'Peace be with you'; he shows them his hands and feet; he asks for food and eats fish — the resurrection is physical","'Everything must be fulfilled that is written about me in the Law of Moses, the Prophets and the Psalms'","He opens their minds so they can understand the Scriptures","Wait for what my Father has promised — you will receive power from on high (the bridge to Acts)","The ascension: he blesses them as he is taken up; they return to Jerusalem with great joy, praising God"],v:"Were not our hearts burning within us while he talked with us on the road and opened the Scriptures to us? (24:32)"},
    ]
  },
  {
    id:"jn1", name:"The Book of Signs (1–6)",
    meta:"The Word made flesh, seven 'I Am' statements begin, signs at Cana and Bethesda, Nicodemus born again, the Samaritan woman, and 'I am the bread of life'",
    chapters:[
      {n:1,t:"The Prologue; the Word Made Flesh; the First Disciples",badge:"ot",s:"The prologue (1:1-18): In the beginning was the Word — the Word was with God and was God; through him all things were made; the Word became flesh and dwelt among us. John the Baptist testifies. Jesus calls the first disciples — Andrew, Peter, Philip, Nathanael.",args:["The Word (Logos): pre-existent, divine, the agent of creation — John opens in eternity, not in Bethlehem","The Word was with God and the Word was God — both distinction (with God) and identity (was God)","The true light coming into the world — the world did not recognize him; his own did not receive him","To all who received him, he gave the right to become children of God — born not of blood or human decision but of God","The Word became flesh and 'tabernacled' among us — we have seen his glory, glory as of the only Son from the Father","Grace and truth: the law was given through Moses; grace and truth came through Jesus Christ","'No one has ever seen God, but the one and only Son, who is himself God... has made him known'","John the Baptist: 'He must become greater; I must become less'; 'Behold, the Lamb of God who takes away the sin of the world'","The first disciples: Andrew tells Peter; Philip finds Nathanael; 'Can anything good come from Nazareth?'"],ot:"Gen 1:1 (in the beginning — the deliberate echo); Exod 33:18-20 (Moses asks to see God's glory; no one can see God — now the Son has made him known); Exod 25:8 (God tabernacling with his people)",v:"The Word became flesh and made his dwelling among us. We have seen his glory, the glory of the one and only Son, who came from the Father, full of grace and truth (1:14)"},
      {n:2,t:"The Wedding at Cana; The Temple Cleansing",badge:"narr",s:"Sign 1: Water turned to wine at Cana — Jesus's first miracle reveals his glory; the disciples believe. The temple cleansing — John places it at the beginning of the ministry, not the end. 'Destroy this temple and in three days I will raise it up.' The disciples remember after the resurrection.",args:["The wedding at Cana: Mary tells Jesus they have no wine; 'My hour has not yet come' — the hour theme runs through the whole gospel","Six stone water jars used for Jewish purification: the old purification system is transformed into the wine of the new covenant","The master of the banquet: 'You have saved the best till now' — the gospel reverses expectations; the best comes last","'He thus revealed his glory, and his disciples believed in him' — the purpose of signs","Temple cleansing in John: placed at the beginning; 'Zeal for your house will consume me'","'Destroy this temple and I will raise it in three days' — they think of the stone temple; John clarifies: he spoke of his body","The disciples remembered this saying after the resurrection and believed — the resurrection is the interpretive key"],ot:"Ps 69:9 (zeal for your house will consume me — the disciples recall this at the temple cleansing); Zech 14:21 (no trader in the house of the Lord)",v:"You have saved the best till now (2:10)"},
      {n:3,t:"Nicodemus; Born Again; John the Baptist's Final Testimony",badge:"disc",s:"Nicodemus comes at night — a Pharisee and teacher who acknowledges Jesus is from God. Jesus tells him he must be born again (or from above). The conversation becomes a theological discourse: the Spirit, the Son of Man lifted up like the bronze serpent, John 3:16. John the Baptist's testimony: the bridegroom and his friend.",args:["Nicodemus: comes at night — he is in darkness; 'We know you are a teacher who has come from God' — the collective 'we' is interesting","'Born again/from above' (anothen — the Greek is deliberately ambiguous): Nicodemus takes it literally; Jesus means spiritually","Born of water and the Spirit — you cannot enter the kingdom otherwise; the Spirit is like the wind: you don't know where it comes from or where it goes","'Just as Moses lifted up the snake in the wilderness, so the Son of Man must be lifted up' — the cross is the new bronze serpent; look and live","For God so loved the world that he gave his one and only Son — the purpose is salvation not condemnation; but those who reject the light are already condemned","John the Baptist: 'I am not the Messiah but am sent ahead of him'; the bride belongs to the bridegroom; the friend of the bridegroom rejoices; 'He must become greater; I must become less'"],ot:"Num 21:8-9 (Moses and the bronze serpent lifted up in the wilderness — the direct type for the crucifixion)",v:"For God so loved the world that he gave his one and only Son, that whoever believes in him shall not perish but have eternal life (3:16)"},
      {n:4,t:"The Samaritan Woman; The Official's Son",badge:"narr",s:"Jesus travels through Samaria. At Jacob's well, he speaks to a Samaritan woman — five husbands, currently not married. He offers living water. 'God is spirit and his worshipers must worship in spirit and truth.' She becomes an evangelist. Sign 2: the official's son healed from a distance.",args:["The woman at the well: Jesus breaks three social barriers — he is Jewish and she is Samaritan; he is a man and she is a woman; she has a scandalous past","'Living water': she thinks of physical water; Jesus means the Spirit — a spring of water welling up to eternal life","The five husbands: Jesus knows her; she concludes he is a prophet","Worship not on this mountain or in Jerusalem but in Spirit and truth — the location of worship is transformed","'I who speak to you am he' — the 'I am' is explicit; this is the clearest self-declaration to anyone in the gospel","The woman leaves her jar and tells the town — the social outcast becomes the first major evangelist in John","The disciples urge Jesus to eat; 'My food is to do the will of him who sent me and to finish his work'","The official's son: 'Unless you people see signs and wonders, you will never believe' — yet he believes; his son lives"],v:"God is spirit, and his worshipers must worship in the Spirit and in truth (4:24)"},
      {n:5,t:"Healing at Bethesda; Jesus's Discourse on the Father and the Son",badge:"disc",s:"Sign 3: the invalid healed at the pool of Bethesda on the Sabbath. The Jewish leaders persecute Jesus. His defense: 'My Father is always at his work to this very day, and I too am working.' The longest discourse in the first half of John — the equality of the Son with the Father, the resurrection, the witnesses.",args:["The invalid: 38 years; 'Do you want to get well?' — Jesus takes the initiative; 'Pick up your mat and walk'","'My Father is always at his work to this very day, and I too am working' — the Jews understand this as claiming equality with God and seek to kill him","The Son can do nothing by himself — he only does what he sees his Father doing; whatever the Father does the Son also does","The Father loves the Son and shows him all he does — even greater things will astonish you","The Son gives life to whom he is pleased to give it — the Father has entrusted all judgment to the Son","Whoever hears my word and believes him who sent me has eternal life — already crossed from death to life","The hour is coming when the dead will hear the voice of the Son of God and live — the resurrection","The witnesses to Jesus: John the Baptist; the works; the Father himself; the Scriptures; Moses"],v:"Very truly I tell you, whoever hears my word and believes him who sent me has eternal life and will not be judged but has crossed over from death to life (5:24)"},
      {n:6,t:"Feeding 5000; Walking on Water; Bread of Life Discourse",badge:"disc",s:"Sign 4: the feeding of the five thousand. Sign 5: walking on water — 'I am; do not be afraid.' The bread of life discourse — the longest theological discourse in John. Jesus is the bread of life; whoever eats his flesh and drinks his blood has eternal life. Many disciples turn back.",args:["The feeding: Jesus tests Philip; 'Where shall we buy bread for these people?' — he already had in mind what he was going to do","Walking on water: 'Ego eimi' (I am) — the divine name; they want to take him by force to make him king; he withdraws","The crowd follows seeking more bread; 'Do not work for food that spoils, but for food that endures to eternal life'","'I am the bread of life. Whoever comes to me will never go hungry, and whoever believes in me will never be thirsty' — the first 'I Am' statement","No one can come to me unless the Father draws them — divine sovereignty in salvation","Whoever eats my flesh and drinks my blood remains in me and I in them — the language of the Eucharist, though John does not record the Last Supper institution","On hearing this, many disciples turned back and no longer followed him — the hard teaching drives many away","'Lord, to whom shall we go? You have the words of eternal life' — Peter's confession in John"],ot:"Exod 16 (manna in the wilderness — the feeding is the new manna; Jesus is the true bread from heaven); Ps 78:24 (he gave them bread from heaven)",v:"Lord, to whom shall we go? You have the words of eternal life. We have come to believe and to know that you are the Holy One of God (6:68-69)"},
    ]
  },
  {
    id:"jn2", name:"Conflict & the Hour Approaches (7–12)",
    meta:"Feast discourses, the woman caught in adultery, 'Before Abraham was I am,' the man born blind, Lazarus raised, and 'The hour has come'",
    chapters:[
      {n:7,t:"The Feast of Tabernacles; Divided Crowds; Rivers of Living Water",badge:"disc",s:"Jesus's brothers urge him to go to Jerusalem publicly — he says his time has not yet come. He goes secretly, then teaches openly at the feast. Division among the crowd. Officers sent to arrest him return empty-handed. 'Streams of living water will flow from within' — the Spirit.",args:["His brothers did not believe in him — the irony of proximity without faith","The timing of Jesus's movements is governed by his hour, not family or social pressure","The crowd is divided: some say he is a good man; others say he deceives the people","'My teaching is not my own. It comes from the one who sent me' — the test of true teaching","'If anyone is thirsty, let him come to me and drink' — on the last and greatest day of the feast; streams of living water flowing from within","John clarifies: he spoke about the Spirit, which those who believed would later receive","The officers: 'No one ever spoke the way this man does' — they cannot arrest him","Nicodemus: 'Does our law condemn a man without first hearing him?' — a partial defense"],ot:"Isa 12:3; 55:1; Zech 14:8 (the water-pouring ceremony at Tabernacles — Jesus redirects the symbol to himself)",v:"Let anyone who is thirsty come to me and drink. Whoever believes in me, as Scripture has said, rivers of living water will flow from within them (7:37-38)"},
      {n:8,t:"The Woman Caught in Adultery; Light of the World; Abraham's Children; Before Abraham Was",badge:"disc",s:"The woman caught in adultery — 'Let the one without sin cast the first stone.' Jesus is the light of the world. The dispute about his testimony. 'The truth will set you free.' Abraham's children — the Jews claim Abraham; Jesus says they are children of the devil. 'Before Abraham was born, I am!'",args:["The woman: Jesus stoops and writes in the dirt — what he wrote is not recorded; 'Let anyone without sin cast the first stone'; they leave oldest first","'I am the light of the world. Whoever follows me will never walk in darkness but will have the light of life' — the second I Am","'Your testimony is not valid' — Jesus's witness to himself; he answers: the Father who sent me also testifies","'The truth will set you free' — 'We are Abraham's descendants and have never been slaves'; Jesus: everyone who sins is a slave to sin","'If you were Abraham's children, you would do what Abraham did' — their actions betray their true parentage","'Your father Abraham rejoiced at the thought of seeing my day; he saw it and was glad'","'Before Abraham was born, I am!' — the absolute I Am statement; the most explicit divine claim; they pick up stones to stone him"],ot:"Exod 3:14 ('I am who I am' — the divine name directly applied to himself); Isa 43:10 (before me no god was formed; 'I am he')",v:"Very truly I tell you, before Abraham was born, I am! (8:58)"},
      {n:9,t:"Sign 6: The Man Born Blind",badge:"narr",s:"Sign 6: a man blind from birth is healed with mud made from spit and dirt — 'Go, wash in the Pool of Siloam.' The lengthy aftermath: the Pharisees interrogate the man and his parents repeatedly. 'One thing I do know. I was blind but now I see!' The man worships Jesus. Those who claim to see are blind.",args:["'Who sinned — this man or his parents?' — Jesus rejects the theology of deserved suffering; 'This happened so that the works of God might be displayed in him'","The mud and the Pool of Siloam — a physical, earthy miracle that the Pharisees find offensive","The Pharisees are divided: some say he cannot be from God because he broke the Sabbath; others say how can a sinner do such signs?","The man's testimony becomes increasingly bold: first 'the man called Jesus'; then 'he is a prophet'; then 'he is from God'","The parents: afraid of being put out of the synagogue — they say 'ask him'","'One thing I do know. I was blind but now I see!' — the simplest and most powerful testimony","The man worships Jesus when Jesus reveals himself","The reversal: the physically blind man comes to spiritual sight; the spiritually 'sighted' Pharisees are revealed as spiritually blind"],v:"One thing I do know. I was blind but now I see! (9:25)"},
      {n:10,t:"The Good Shepherd; I Am the Gate; I Am the Good Shepherd; Dedication Feast",badge:"disc",s:"The extended shepherd discourse — the third and fourth I Am statements. Jesus is the gate for the sheep; Jesus is the good shepherd who lays down his life. The Jews are divided again. At the Feast of Dedication: 'I and the Father are one.' They pick up stones.",args:["The thieves and robbers came before — referring to the Pharisees who tried to reclaim the blind man","'I am the gate for the sheep' — whoever enters through me will be saved; they will come in and go out and find pasture (third I Am)","'I am the good shepherd. The good shepherd lays down his life for the sheep' (fourth I Am)","The hired hand abandons the sheep when the wolf comes — he cares nothing for the sheep","'I have other sheep that are not of this sheep pen' — the Gentiles; one flock and one shepherd","'No one takes my life from me, but I lay it down of my own accord. I have authority to lay it down and authority to take it up again'","At the Feast of Dedication: 'I and the Father are one' — the Jews pick up stones for blasphemy","'You are gods' (Ps 82:6) — if Scripture calls them gods, how can it be blasphemy to say I am the Son of God?"],ot:"Ezek 34 (the bad shepherds of Israel — the background for the entire discourse; God himself will be the shepherd)",v:"I am the good shepherd. The good shepherd lays down his life for the sheep (10:11)"},
      {n:11,t:"Sign 7: The Raising of Lazarus; I Am the Resurrection",badge:"narr",s:"Lazarus is ill — Jesus delays two days. He arrives; Lazarus has been dead four days. Martha meets him: 'If you had been here, my brother would not have died.' 'I am the resurrection and the life.' Jesus weeps. He cries out: 'Lazarus, come out!' The Sanhedrin decides he must die.",args:["The delay is deliberate: so that the Son of God may be glorified through it","The disciples misunderstand 'sleep' for literal sleep — Jesus speaks plainly: 'Lazarus is dead'","Thomas: 'Let us also go, that we may die with him' — courage mixed with misunderstanding","Martha: 'If you had been here, my brother would not have died. But I know that even now God will give you whatever you ask'","'I am the resurrection and the life. The one who believes in me will live, even though they die' — the fifth I Am","'Do you believe this?' — 'Yes, Lord... I believe you are the Messiah, the Son of God' — Martha's confession","'Jesus wept' — the shortest verse in the Bible; the full humanity of God; he is moved by our grief","'Lazarus, come out!' — the man comes out bound hand and foot; 'Take off the grave clothes and let him go'","The Sanhedrin: 'This man is performing many signs'; Caiaphas's unwitting prophecy: 'it is better for you that one man die for the people'"],v:"I am the resurrection and the life. The one who believes in me will live, even though they die; and whoever lives by believing in me will never die (11:25-26)"},
      {n:12,t:"Anointing at Bethany; Triumphal Entry; Greeks Seek Jesus; The Hour Has Come",badge:"narr",s:"Mary anoints Jesus's feet with expensive perfume — Judas objects. The triumphal entry. The Greeks (Gentiles) seek Jesus — this triggers the Hour announcement. The grain of wheat must fall into the ground and die. The Father's voice. The judgment of this world.",args:["Mary anoints Jesus's feet: Judas objects ('sold for a year's wages'); 'Leave her alone; it was intended that she should save this perfume for the day of my burial'","The triumphal entry: fulfilling Zech 9:9; the disciples did not understand at first — they understood after the resurrection","The Greeks want to see Jesus — this triggers the Hour announcement: 'The hour has come for the Son of Man to be glorified'","The grain of wheat: unless it falls into the ground and dies, it remains only a single seed; but if it dies, it produces many seeds","'Father, glorify your name' — a voice from heaven: 'I have glorified it and will glorify it again'; the crowd is divided","'Now is the time for judgment on this world; now the prince of this world will be driven out'","'And I, when I am lifted up from the earth, will draw all people to myself' — the cross as the magnet","Even after all these signs, they still did not believe — Isaiah's words are fulfilled: he has blinded their eyes"],ot:"Zech 9:9 (your king comes riding on a donkey); Isa 6:10 (blindness and hardness — cited to explain unbelief); Isa 53:1 (who has believed our message?)",v:"Very truly I tell you, unless a kernel of wheat falls to the ground and dies, it remains only a single seed. But if it dies, it produces many seeds (12:24)"},
    ]
  },
  {
    id:"jn3", name:"The Farewell Discourse (13–17)",
    meta:"The foot washing, 'I am the way, the truth, and the life,' 'I am the true vine,' the promise of the Spirit, and the High Priestly Prayer",
    chapters:[
      {n:13,t:"The Foot Washing; The New Commandment; Judas; Peter's Denial Predicted",badge:"disc",s:"Before the Passover feast, Jesus washes the disciples' feet. Peter objects — 'Unless I wash you, you have no part with me.' Judas is identified. The new commandment: love one another as I have loved you. Peter's denial predicted.",args:["The foot washing: knowing that the hour had come, knowing the Father had put all things under his power — he takes a towel and washes feet; the exalted one humbles himself","Peter: 'You shall never wash my feet'; 'Unless I wash you, you have no part with me'; 'Then not just my feet but my hands and head as well'","The foot washing is an example — you also should wash one another's feet","'No servant is greater than his master' — the greatest is the servant of all; this is the explicit theology of servant leadership","Judas's departure: he went out; and it was night — the darkness motif reaches its apex","'Now the Son of Man is glorified and God is glorified in him' — the crucifixion is glory in John","The new commandment: 'Love one another as I have loved you' — the measure is Christ's own love","'By this everyone will know that you are my disciples, if you love one another' — the apologetic power of church unity"],v:"A new command I give you: Love one another. As I have loved you, so you must love one another (13:34)"},
      {n:14,t:"Farewell Discourse Part 1: The Way, the Truth, the Life; The Spirit",badge:"disc",s:"'Do not let your hearts be troubled.' 'I am the way and the truth and the life.' 'Whoever has seen me has seen the Father.' 'I will ask the Father, and he will give you another Advocate/Helper.' 'Peace I leave with you.'",args:["'Do not let your hearts be troubled. You believe in God; believe also in me. My Father's house has many rooms'","'I am the way and the truth and the life. No one comes to the Father except through me' — the sixth I Am; the most exclusive claim in John","Philip: 'Show us the Father'; 'Anyone who has seen me has seen the Father' — the full revelation","The works that Jesus does — and greater works, because he goes to the Father","Ask in my name — whatever you ask in my name I will do","'I will ask the Father, and he will give you another Advocate to be with you forever — the Spirit of truth'","The Spirit will be in you — the indwelling of the Trinity: 'I am in my Father, and you are in me, and I am in you'","'Peace I leave with you; my peace I give you. I do not give to you as the world gives. Do not let your hearts be troubled and do not be afraid'"],v:"I am the way and the truth and the life. No one comes to the Father except through me (14:6)"},
      {n:15,t:"Farewell Discourse Part 2: The Vine; Remain in Me; The World's Hatred",badge:"disc",s:"'I am the true vine' — the seventh and final I Am statement. Remain in me as I remain in you. If you remain in me, ask whatever you wish. Love one another. The world will hate you because it hated me first.",args:["'I am the true vine, and my Father is the gardener' — the seventh I Am; Israel was the vine in the OT (Ps 80, Isa 5); Jesus is the true vine","Every branch in me that bears no fruit the Father cuts away; every branch that bears fruit he prunes","'Remain in me and I will remain in you. No branch can bear fruit by itself' — the absolute necessity of union with Christ","'If you remain in me and my words remain in you, ask whatever you wish, and it will be done for you'","The command to love: 'My command is this: Love each other as I have loved you. Greater love has no one than this: to lay down one's life for one's friends'","'You did not choose me, but I chose you' — election; appointed to go and bear fruit that will last","The world hates you: 'If the world hates you, keep in mind that it hated me first'","'They will treat you this way because of my name, for they do not know the one who sent me'"],ot:"Ps 80:8-19 (you transplanted a vine from Egypt — Israel as the vine); Isa 5:1-7 (the vineyard song — the true vine supersedes the failed vine)",v:"Greater love has no one than this: to lay down one's life for one's friends (15:13)"},
      {n:16,t:"Farewell Discourse Part 3: The Spirit's Work; Grief Turned to Joy",badge:"disc",s:"The Spirit will convict the world of sin, righteousness, and judgment. He will guide you into all truth. A little while and you will see me no more, then a little while and you will see me — grief turned to joy. Ask in my name. The Father loves you.",args:["They are told so that they will not fall away — the disciples need to know persecution is coming","The Advocate will come only if Jesus goes — it is better for you that I go","The Spirit will convict the world of guilt in regard to sin, righteousness, and judgment","'He will guide you into all the truth. He will not speak on his own; he will speak only what he hears' — the Spirit is the interpreter of Jesus","A little while and you will not see me; a little while and you will see me — the disciples don't understand","The woman in labor: her anguish is turned to joy when the baby is born — the same joy at the resurrection","'In that day you will ask in my name. I am not saying that I will ask the Father on your behalf. No, the Father himself loves you'","'I have told you these things so that in me you may have peace. In this world you will have trouble. But take heart! I have overcome the world.'"],v:"I have told you these things, so that in me you may have peace. In this world you will have trouble. But take heart! I have overcome the world (16:33)"},
      {n:17,t:"The High Priestly Prayer",badge:"disc",s:"The longest prayer of Jesus recorded anywhere. Three sections: Jesus prays for himself (glorify your Son), for the disciples (protect them, sanctify them), and for all future believers (that they may all be one as the Father and Son are one).",args:["For himself: 'Father, the hour has come. Glorify your Son, that your Son may glorify you' — the cross is glory","'Now this is eternal life: that they know you, the only true God, and Jesus Christ, whom you have sent' — eternal life defined as relationship","For the disciples: 'I am no longer in the world, but they are still in the world, and I am coming to you' — the transition of care","'I have given them your word and the world has hated them, for they are not of the world'","'My prayer is not that you take them out of the world but that you protect them from the evil one'","'Sanctify them by the truth; your word is truth' — the instrument of sanctification","For all future believers: 'that all of them may be one, Father, just as you are in me and I am in you'","The purpose of unity: 'so that the world may believe that you have sent me' — church unity is an evangelistic strategy","'Father, I want those you have given me to be with me where I am, and to see my glory'"],v:"Now this is eternal life: that they know you, the only true God, and Jesus Christ, whom you have sent (17:3)"},
    ]
  },
  {
    id:"jn4", name:"Passion & Resurrection (18–21)",
    meta:"'I am he' at the arrest, 'It is finished' at the cross, 'My Lord and my God' at the resurrection, and Peter restored on the beach",
    chapters:[
      {n:18,t:"The Arrest; Trial Before Annas and Pilate",badge:"narr",s:"Judas leads a detachment of soldiers to Gethsemane — Jesus steps forward: 'I am he' and they fall backward. Peter cuts off Malchus's ear. Jesus before Annas and Caiaphas. Peter's three denials. Jesus before Pilate — 'What is truth?' Pilate finds no basis for a charge.",args:["'Who is it you want?' — 'Jesus of Nazareth.' 'I am he.' — at the use of the divine name, they draw back and fall to the ground","Jesus insists on the disciples' safety: 'Let these men go' — the shepherd protects the sheep to the end","Peter's denial begins immediately — even as Jesus stands boldly before the high priest","'If I said something wrong, testify as to what is wrong. But if I spoke the truth, why did you strike me?'","Pilate: 'What charges are you bringing against this man?'; 'My kingdom is not of this world'; 'Everyone on the side of truth listens to me'","'What is truth?' — Pilate does not wait for an answer; he goes back out","Pilate finds no basis for a charge — the first of three declarations of innocence in John"],v:"My kingdom is not of this world. If it were, my servants would fight to prevent my arrest by the Jewish leaders. But now my kingdom is from another place (18:36)"},
      {n:19,t:"The Crucifixion & Death",badge:"narr",s:"The crown of thorns; 'Behold the man!' Pilate presents him: 'Crucify!' The charge written: 'King of the Jews' in three languages. Jesus's garments divided. 'It is finished.' The side pierced — blood and water flow. Joseph of Arimathea and Nicodemus bury him.",args:["The crown of thorns and the purple robe: 'Hail, king of the Jews!' — an ironic mockery that is true","'Here is the man!' (Ecce homo) — Pilate presents the scourged Jesus; the crowd shouts 'Crucify!'","'We have a law, and according to that law he must die, because he claimed to be the Son of God' — when Pilate hears this, he is even more afraid","'You would have no power over me if it were not given to you from above' — divine sovereignty over the passion","The charge in Hebrew, Latin, and Greek: 'JESUS OF NAZARETH, THE KING OF THE JEWS' — a universal proclamation","Jesus's care from the cross: 'Woman, here is your son'; 'Here is your mother' — the new family of the church","'It is finished' (tetelestai) — the work of redemption is completed; the same word as 'It is accomplished'; a word of triumph, not defeat","The side pierced: blood and water flow — the eyewitness emphasizes this; theological significance (Eucharist and baptism, or simply death fully confirmed)","Nicodemus brings 75 pounds of spices — the secret disciple comes fully into the open at the cross"],ot:"Ps 22:18 (garments divided by lots — John notes the fulfillment explicitly); Zech 12:10 (they will look on the one they have pierced); Exod 12:46 (no bone broken — the Passover lamb)",v:"When he had received the drink, Jesus said, 'It is finished.' With that, he bowed his head and gave up his spirit (19:30)"},
      {n:20,t:"The Resurrection; Mary Magdalene; Thomas",badge:"narr",s:"Mary Magdalene finds the empty tomb and runs to Peter and the beloved disciple. They look in and the beloved disciple believes. Mary stays and weeps — Jesus appears to her: 'Mary.' She recognizes him by his voice. He appears to the disciples. Thomas doubts — Jesus returns; 'My Lord and my God.' The purpose statement of the book.",args:["The beloved disciple outran Peter but waits; Peter goes in first; the beloved disciple saw and believed — without yet understanding the Scripture","Mary Magdalene outside weeping: she sees two angels, then turns and sees Jesus but does not recognize him — thinks he is the gardener","'Mary' — she recognizes him by his voice; 'Rabboni!' — My Teacher","'Do not hold on to me, for I have not yet ascended to the Father' — the ascension is still coming","Jesus breathes on them: 'Receive the Holy Spirit. If you forgive anyone's sins, their sins are forgiven' — the gift of the Spirit anticipated","Thomas: 'Unless I see the nail marks... I will not believe'; a week later Jesus appears and invites him to touch","'My Lord and my God!' — the highest Christological confession in any gospel; Jesus accepts it without correction","'Blessed are those who have not seen and yet have believed' — the gospel was written for those who were not there","The purpose statement: 'These are written that you may believe that Jesus is the Messiah, the Son of God, and that by believing you may have life in his name'"],v:"Thomas said to him, 'My Lord and my God!' (20:28)"},
      {n:21,t:"The Resurrection Appearance at the Sea; Peter Restored; The Beloved Disciple",badge:"narr",s:"The disciples fish all night and catch nothing. Jesus appears on the shore — cast the net on the right side; 153 fish. Peter jumps into the water. Jesus has breakfast waiting. Peter is restored: 'Do you love me?' three times — 'Feed my sheep.' The death of the beloved disciple discussed. The book closes.",args:["The miraculous catch of 153 fish: the net was not torn — completeness and abundance; the new mission","The beloved disciple recognizes Jesus first; Peter jumps into the water fully clothed","Breakfast on the beach: Jesus takes bread and gives it to them, and fish — the Eucharistic echoes continue","The threefold restoration: three denials undone by three questions; 'Do you love me?' — 'Lord, you know all things; you know that I love you'","The three commissions: 'Feed my lambs / Take care of my sheep / Feed my sheep'","The death predicted: 'When you are old you will stretch out your hands' — the kind of death by which Peter would glorify God","'Follow me!' — the same words as the original call","The beloved disciple's fate: rumors he would not die; Jesus did not say that — a correction of a misunderstanding","The closing: Jesus did many other things; if every one were written down, the whole world would not have room for the books"],v:"Jesus said to him, 'Feed my sheep' (21:17)"},
    ]
  },
];

const ACTS = [
  {
    id:"a1", name:"Jerusalem (1–7)",
    meta:"The church is born — Spirit poured out at Pentecost, bold witness before the Sanhedrin, first martyr",
    chapters:[
      {n:1,t:"Ascension, Commission & Matthias",badge:"narr",s:"Jesus ascends after forty days of resurrection appearances, commissioning the disciples as witnesses to the ends of the earth. They wait in Jerusalem, and Matthias replaces Judas by lot.",args:["The Great Commission restated: witnesses in Jerusalem, Judea, Samaria, and the ends of the earth — the geographic outline of the whole book","Jesus's ascension is not abandonment — he is enthroned and will send the Spirit","The disciples ask about restoring the kingdom to Israel — Jesus redirects them from speculation to mission","Matthias chosen by lot — the apostolic circle of twelve is restored before Pentecost","The upper room: 120 disciples praying together — unity before empowerment"],ot:"Ps 69:25 and Ps 109:8 cited to justify replacing Judas; the number twelve echoes the twelve tribes",v:"You will receive power when the Holy Spirit comes on you; and you will be my witnesses in Jerusalem, and in all Judea and Samaria, and to the ends of the earth (1:8)"},
      {n:2,t:"Pentecost & the Birth of the Church",badge:"narr",s:"The Spirit falls on the 120 with wind, fire, and tongues. The crowd is amazed. Peter preaches the first Christian sermon — Jesus is Lord and Christ. Three thousand are baptized.",args:["Wind and fire echo Sinai — the new covenant community receives the law written on hearts (Jer 31) via the Spirit","Tongues: every nation hears in their own language — reversal of Babel","Peter's sermon: David's words in Psalm 16 and 110 apply to the resurrected Jesus, not David himself","The resurrection is the vindication and exaltation of Jesus — God made him both Lord and Christ","'What shall we do?' — repent and be baptized for forgiveness and the gift of the Spirit","Three thousand added — the community of goods and daily temple worship begins"],ot:"Joel 2:28-32 (Spirit poured on all flesh); Ps 16:8-11 (not abandoned to Hades); Ps 110:1 (Lord said to my Lord)",v:"God has made this Jesus, whom you crucified, both Lord and Messiah (2:36)"},
      {n:3,t:"Lame Man Healed & Peter's Second Sermon",badge:"narr",s:"Peter and John heal a lame man at the Beautiful Gate. The crowd gathers in Solomon's Colonnade. Peter preaches: this is the fulfillment of what the prophets foretold — the Messiah must suffer and rise.",args:["'Silver or gold I do not have, but what I do have I give you' — healing in the name of Jesus","Peter corrects the crowd: we didn't do this by our own power or godliness","You killed the Author of life, but God raised him — Peter is boldly confrontational","Times of refreshing and restoration of all things — eschatological hope tied to repentance","Moses predicted a prophet like himself — that prophet is Jesus (Deut 18:15)","Abraham's covenant: through your offspring all nations blessed — now being fulfilled"],ot:"Deut 18:15 (prophet like Moses); Gen 22:18 (Abraham's offspring blessing all nations); Isa 52:13 (servant glorified)",v:"Repent, then, and turn to God, so that your sins may be wiped out, that times of refreshing may come from the Lord (3:19)"},
      {n:4,t:"Arrest, Bold Prayer & Community Life",badge:"narr",s:"Peter and John are arrested. Before the Sanhedrin, Peter boldly attributes the healing to Jesus — the stone the builders rejected. They are released. The church prays boldly and shares possessions.",args:["Five thousand men believe — the gospel spreads despite (because of?) opposition","Peter, filled with the Spirit, before the same council that condemned Jesus","'Salvation is found in no one else' — the exclusivity claim made to the highest Jewish court","The council observes they are unschooled men who had been with Jesus","The church prays Psalm 2 over the opposition — rulers rage against the Lord's anointed","No one claimed their possessions were their own — radical economic sharing"],ot:"Ps 118:22 (stone the builders rejected — cornerstone); Ps 2:1-2 (rulers conspire against the Lord)",v:"Salvation is found in no one else, for there is no other name under heaven given to mankind by which we must be saved (4:12)"},
      {n:5,t:"Ananias & Sapphira; Apostles Arrested Again",badge:"narr",s:"Ananias and Sapphira lie about their gift and both die. Great fear falls on the church. The apostles are arrested again, miraculously freed, beaten, and rejoice that they suffered for the Name.",args:["Lying to the Holy Spirit = lying to God — the Spirit is personally divine","The sin is not keeping money back but deception — the boundary between church and world must be clear","Signs and wonders: Peter's shadow heals; the sick are brought to the streets","The Sanhedrin is furious — Gamaliel's wisdom: if it's from God you cannot stop it","The apostles leave rejoicing that they were counted worthy to suffer for the Name"],ot:"Achan's sin (Josh 7) is the typological background — secret sin that corrupts the community",v:"We must obey God rather than human beings! (5:29)"},
