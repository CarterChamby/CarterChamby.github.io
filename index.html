      {n:6,t:"The Seven Appointed & Stephen Accused",badge:"narr",s:"Conflict arises over the daily distribution — Hellenist widows are neglected. The Seven are appointed to serve tables so the apostles can devote themselves to prayer and the word. Stephen is seized on false charges.",args:["The first internal church conflict: ethnic tension between Hellenist and Hebrew Jews","The Twelve cannot neglect the word of God to serve tables — functional division of ministry","The Seven: all have Greek names — the Hellenists' representatives chosen to serve the Hellenists","Stephen: full of grace and power, did great wonders — a deacon who acts like an apostle","False witnesses: 'We heard him speak against Moses and God' — echoes Jesus's trial"],v:"We will turn this responsibility over to them and will give our attention to prayer and the ministry of the word (6:3-4)"},
      {n:7,t:"Stephen's Speech & Martyrdom",badge:"disc",s:"Stephen's speech is the longest in Acts — a retelling of Israel's history showing that Israel has always rejected God's messengers. The climax: they killed the Righteous One. Stephen is stoned, becoming the first martyr. Saul watches approvingly.",args:["Abraham → Joseph → Moses → the tabernacle → Solomon: a telescoped history of rejection and faithfulness","Joseph was rejected by his brothers but became their savior — a Joseph/Jesus typology","Moses: rejected the first time ('Who made you ruler?'), accepted the second — a Moses/Jesus typology","'You stiff-necked people... you always resist the Holy Spirit' — the charge is consistent rejection across generations","Stephen sees Jesus standing at the right hand of God — the Son of Man vindicated","Stephen's death mirrors Jesus's: prays for forgiveness of his killers; commits his spirit","Saul is introduced — holding the cloaks of those stoning Stephen"],ot:"The entire chapter is a sustained midrash on the Pentateuch; Amos 5:25-27 and Isa 66:1-2 cited in the climax",v:"Look, I see heaven open and the Son of Man standing at the right hand of God! (7:56)"},
    ]
  },
  {
    id:"a2", name:"Judea & Samaria (8–12)",
    meta:"Gospel crosses ethnic boundaries — Samaritans, an Ethiopian, a Roman centurion, and a persecutor all brought in",
    chapters:[
      {n:8,t:"Persecution, Philip & Simon the Sorcerer",badge:"narr",s:"Persecution scatters the church — but the scattered preach everywhere. Philip evangelizes Samaria. Simon the Sorcerer tries to buy the Spirit. Philip and the Ethiopian eunuch: Isaiah 53 explained and baptism administered.",args:["Persecution advances the mission — the scattering fulfills the 'Judea and Samaria' phase of 1:8","Philip in Samaria: the half-breed enemies of Israel receive the gospel — a major boundary crossed","Simon Magus: the desire to purchase spiritual power ('simony') rebuked sharply","The Ethiopian eunuch: reading Isa 53 — 'who is the prophet talking about?' — Philip explains Jesus","The eunuch: a Gentile God-fearer on the margins is welcomed fully into the community","Philip is supernaturally transported to Azotus — the Spirit drives the mission"],ot:"Isa 53:7-8 (sheep led to slaughter — cited and applied to Jesus in the Ethiopian conversation)",v:"Then Philip began with that very passage of Scripture and told him the good news about Jesus (8:35)"},
      {n:9,t:"Saul's Conversion & Early Ministry",badge:"narr",s:"Saul on the road to Damascus is confronted by the risen Jesus — 'Saul, why do you persecute me?' He is blinded, converted, and baptized. Ananias is sent to him. Saul immediately preaches in synagogues and must escape Damascus in a basket.",args:["'Why do you persecute me?' — Jesus identifies with his persecuted people; to persecute the church is to persecute Christ","Saul is a chosen instrument to carry the Name before Gentiles, kings, and Israel","Ananias's reluctance: Saul's reputation precedes him; God overrides with the bigger plan","Saul in Damascus: immediately preaching that Jesus is the Son of God — the persecutor becomes the preacher","Peter heals Aeneas and raises Tabitha (Dorcas) — the apostolic ministry continues in parallel"],v:"This man is my chosen instrument to proclaim my name to the Gentiles and their kings and to the people of Israel (9:15)"},
      {n:10,t:"Cornelius: The Gentile Pentecost",badge:"narr",s:"Cornelius (a Roman centurion) has a vision. Peter has a vision of unclean animals — 'Do not call anything impure that God has made clean.' Peter visits Cornelius. The Spirit falls on the Gentiles before Peter even finishes speaking.",args:["The sheet vision: dietary laws as a barrier between Jews and Gentiles are abolished in Christ","'God does not show favoritism but accepts from every nation the one who fears him and does what is right'","Peter preaches the gospel to Gentiles — the same gospel, the same Lord of all","The Spirit falls mid-sermon — God acts before the church decides; the circumcised believers are astonished","Peter commands them to be baptized — the Spirit's coming is the authorization","This is the Gentile Pentecost — structurally parallel to chapter 2"],v:"I now realize how true it is that God does not show favoritism but accepts from every nation the one who fears him and does what is right (10:34-35)"},
      {n:11,t:"Peter Defends Himself; Antioch Church Founded",badge:"narr",s:"Peter returns to Jerusalem and is criticized for eating with Gentiles. He retells the Cornelius story — the critics are silenced and glorify God. The Antioch church is founded by scattered believers; Barnabas and Saul teach there for a year.",args:["The Jerusalem church's objection is not the conversion but the table fellowship — the social boundary","Peter's defense: 'Who was I to think that I could stand in God's way?' — the Spirit's action is decisive","The church at Antioch: the first majority-Gentile church; the disciples first called 'Christians' here","Barnabas sent to investigate — he encourages them and fetches Saul from Tarsus","Agabus prophesies famine — the Antioch church sends relief to Judea; Gentiles supporting Jewish believers"],v:"The Lord's hand was with them, and a great number of people believed and turned to the Lord (11:21)"},
      {n:12,t:"James Killed; Peter Miraculously Released",badge:"narr",s:"Herod kills James the brother of John — the first apostolic martyrdom. He arrests Peter intending to kill him after Passover. An angel releases Peter miraculously. Herod is struck dead for accepting divine honors. The word of God continues to spread.",args:["James's death is reported without elaboration — martyrdom is part of the cost","Peter's miraculous release: the church is praying earnestly; they don't believe it when he shows up","Rhoda leaves Peter knocking at the door in her excitement — a moment of comedy in Acts","Herod's death: eaten by worms for accepting divine honors — the contrast with Jesus's resurrection is stark","But the word of God continued to spread and flourish — opposition cannot stop the mission"],v:"But the word of God continued to spread and flourish (12:24)"},
    ]
  },
  {
    id:"a3", name:"First Journey & Council (13–15)",
    meta:"Paul turns to the Gentiles — first missionary journey through Cyprus and Galatia, then the Jerusalem Council settles salvation by grace alone",
    chapters:[
      {n:13,t:"First Missionary Journey Begins; Pisidian Antioch Sermon",badge:"narr",s:"The Spirit sets apart Barnabas and Saul at Antioch. They travel to Cyprus, then to Pisidian Antioch where Paul preaches a synagogue sermon — the fullest account of his preaching to Jews. When Jews reject, they turn to the Gentiles.",args:["The Spirit commissions the mission — the church does not initiate; they respond to the Spirit's call","Sergius Paulus converted; Elymas the sorcerer struck blind — Paul's authority demonstrated","Paul's synagogue sermon: Israel's history → David → Jesus → resurrection → forgiveness — echoes Peter's Pentecost sermon","'Through him everyone who believes is set free from everything you could not be freed from by the law of Moses'","The Jews reject; Paul and Barnabas turn to the Gentiles — citing Isa 49:6 as their mandate","The Gentiles rejoice; the word spreads through the whole region"],ot:"Ps 2:7 (you are my Son); Isa 55:3 (David's holy blessings); Ps 16:10 (not see decay); Hab 1:5 (scoffers beware); Isa 49:6 (light to the Gentiles)",v:"We had to speak the word of God to you first. Since you reject it… we now turn to the Gentiles (13:46)"},
      {n:14,t:"Iconium, Lystra, Derbe & Return",badge:"narr",s:"Paul and Barnabas continue through Iconium and Lystra. At Lystra Paul heals a lame man — the crowd tries to worship them as Zeus and Hermes. Paul corrects them with natural theology. Paul is stoned and left for dead. They return strengthening the churches.",args:["Iconium: division — some believe, some don't; they stay a long time, then flee when stoned","Lystra: healing a lame man triggers pagan worship — Paul and Barnabas tear their clothes in horror","Natural theology sermon: the living God made everything and gave rain and crops — even without Scripture, God witnesses to himself","The same crowd that tried to worship Paul stones him and leaves him for dead","Paul gets up and goes back into the city — extraordinary resilience","Return journey: strengthening disciples and appointing elders in every church; 'through many hardships we must enter the kingdom'"],v:"We must go through many hardships to enter the kingdom of God (14:22)"},
      {n:15,t:"The Jerusalem Council",badge:"disc",s:"The defining moment of early Christianity: must Gentiles be circumcised to be saved? The Jerusalem council hears Paul, Barnabas, and Peter. James gives the ruling — Gentiles need not be circumcised. A letter is sent. The church is unified.",args:["The Judaizers: 'Unless you are circumcised according to the custom of Moses, you cannot be saved' — the direct challenge","Peter's testimony: God gave Gentiles the Spirit just as he gave it to us — no distinction","'Why do you try to test God by putting on the necks of the disciples a yoke that neither we nor our ancestors have been able to bear?'","Paul and Barnabas report signs and wonders among the Gentiles — God's endorsement","James's ruling: Amos 9:11-12 supports Gentile inclusion without circumcision","The letter: abstain from food sacrificed to idols, from blood, from strangled meat, from sexual immorality — minimal requirements for table fellowship","Paul and Barnabas split over John Mark — two missionary teams result"],ot:"Amos 9:11-12 (rebuilding David's fallen tent; the remnant of humanity seeking the Lord)",v:"We believe it is through the grace of our Lord Jesus that we are saved, just as they are (15:11)"},
    ]
  },
  {
    id:"a4", name:"2nd & 3rd Journeys (16–20)",
    meta:"The gospel enters Europe — Philippi, Thessalonica, Athens, Corinth, Ephesus — two years of world-shaking mission",
    chapters:[
      {n:16,t:"Timothy; Macedonian Call; Philippi",badge:"narr",s:"Paul takes Timothy, who is circumcised for the sake of Jewish mission. The Spirit redirects them westward via a vision of a Macedonian man. In Philippi: Lydia converted, a slave girl freed, Paul and Silas imprisoned, the jailer converted after an earthquake.",args:["Timothy circumcised: contextual wisdom, not theological compromise — for access to Jewish audiences","The Macedonian vision: the mission crosses into Europe — a pivotal geographic turning point","Lydia: a businesswoman and God-fearer; her household baptized; she insists on hosting Paul","The slave girl: Paul casts out the spirit of divination — her owners are furious at lost income","Paul and Silas praying and singing hymns in jail at midnight — suffering with joy","The earthquake; the jailer about to kill himself; 'What must I do to be saved?' — 'Believe in the Lord Jesus'","Paul asserts his Roman citizenship — the magistrates apologize publicly"],v:"Believe in the Lord Jesus, and you will be saved — you and your household (16:31)"},
      {n:17,t:"Thessalonica, Berea & Athens (Areopagus)",badge:"narr",s:"Thessalonica: a riot; accused of turning the world upside down. Berea: noble Bereans examine the Scriptures daily. Athens: Paul is troubled by idols; his Areopagus speech uses Greek philosophy to introduce the Creator God and the resurrection.",args:["Thessalonica: 'These men who have caused trouble all over the world have now come here' — the charge is a compliment","The Bereans: examine the Scriptures daily to see if Paul is right — the model of theological discernment","Athens: Paul's spirit provoked by the idols — the city is full of them","Areopagus speech: starts where the audience is (the unknown god, their poets) before introducing Christ","'In him we live and move and have our being' — citing Greek poets as partial witnesses to the Creator","The resurrection is the sticking point — some sneer, some want to hear more, some believe","Natural theology can go only so far — the resurrection of Jesus is the unavoidable claim"],ot:"The speech has no OT citations — deliberately so; Paul adapts his argument to a non-Jewish audience",v:"For in him we live and move and have our being (17:28)"},
      {n:18,t:"Corinth; Aquila & Priscilla; Apollos",badge:"narr",s:"Paul spends eighteen months in Corinth — his longest stay yet. He meets Aquila and Priscilla (tentmakers). Opposition rises; the Lord encourages him in a vision. He is brought before Gallio. Apollos arrives — eloquent but knowing only John's baptism; Priscilla and Aquila instruct him.",args:["Paul works as a tentmaker — supporting himself rather than burdening the church","Jewish opposition: 'Your blood be on your own heads' — Paul turns to the Gentiles","The Lord's vision: 'Do not be afraid... I have many people in this city' — divine encouragement mid-mission","Gallio refuses to judge religious matters — an important precedent; Rome sees Christianity as an internal Jewish dispute","Apollos: powerful in the Scriptures, but only knowing John's baptism — Priscilla and Aquila complete his understanding"],v:"Do not be afraid; keep on speaking, do not be silent. For I am with you (18:9-10)"},
      {n:19,t:"Ephesus: Disciples of John; Riot of Artemis",badge:"narr",s:"Paul finds disciples who received only John's baptism — they are baptized in the name of Jesus and receive the Spirit. Paul spends two years in Ephesus — the whole province hears the word. Demetrius the silversmith stirs a riot to protect the Artemis trade.",args:["The twelve disciples of John: incomplete initiation — the Spirit has not even been mentioned to them; baptism in Jesus's name and the Spirit given by laying on of hands","Two years in the Hall of Tyrannus: the whole province of Asia hears the word — maximum impact from a central city","Extraordinary miracles: handkerchiefs and aprons from Paul heal the sick — the power is clearly not Paul's","The seven sons of Sceva: try to use Jesus's name without knowing Jesus — the demon overpowers them","The Ephesians burn their magic scrolls — 50,000 drachmas worth; counting the cost and making a clean break","Demetrius's riot: the gospel threatens the idol trade — economic opposition to the mission"],v:"In this way the word of the Lord spread widely and grew in power (19:20)"},
      {n:20,t:"Paul's Farewell to the Ephesian Elders",badge:"disc",s:"Paul travels through Macedonia and Greece. Eutychus falls from a window and is raised. Paul bypasses Ephesus but summons the elders to Miletus for a farewell speech — the only speech in Acts addressed to believers. He predicts suffering and warns of false teachers.",args:["Paul's summary of his ministry at Ephesus: preached publicly and house to house; declared the whole will of God; kept nothing back","Compelled by the Spirit to Jerusalem; not knowing what will happen — but ready to die","After my departure, savage wolves will come in and distort the truth — elders must guard the flock","I have coveted no one's silver or gold — the model of financially disinterested ministry","'It is more blessed to give than to receive' — a saying of Jesus not recorded in the Gospels","The elders weep and embrace him — the most emotionally intimate moment in Acts"],v:"Keep watch over yourselves and all the flock of which the Holy Spirit has made you overseers (20:28)"},
    ]
  },
  {
    id:"a5", name:"Arrest to Rome (21–28)",
    meta:"Paul's journey to Rome under arrest — trials before Felix, Festus, and Agrippa; shipwreck; the gospel reaches the empire's capital",
    chapters:[
      {n:21,t:"Journey to Jerusalem; Paul Arrested in the Temple",badge:"narr",s:"Disciples urge Paul not to go to Jerusalem. Agabus prophesies his arrest. Paul is resolute: 'I am ready to die for the name of the Lord Jesus.' In Jerusalem, James warns of Jewish Christian concerns about Paul. Paul is seized in the temple.",args:["Multiple warnings from the Spirit through prophets — Paul interprets them as information, not prohibition","'What does this weeping mean? You are breaking my heart' — Paul's resolute love for the mission","James's concern: thousands of Jewish believers zealous for the law have heard Paul teaches against Moses — a PR crisis","Paul purifies himself in the temple to demonstrate he has not abandoned Jewish customs","Asian Jews spot him and stir the crowd — 'This is the man who teaches against our people'","Roman soldiers rescue Paul from the mob — Roman protection will carry Paul to Rome"],v:"I am ready not only to be bound, but also to die in Jerusalem for the name of the Lord Jesus (21:13)"},
      {n:22,t:"Paul's Defense Speech to the Jerusalem Crowd",badge:"disc",s:"Paul addresses the crowd in Aramaic — they go quiet. He recounts his conversion and commission. When he mentions being sent to the Gentiles, the crowd erupts. Paul claims his Roman citizenship to avoid flogging.",args:["Speaking in Aramaic commands silence — cultural respect disarms the crowd initially","Paul's conversion account told in first person — the second of three accounts in Acts","Ananias described as 'a devout observer of the law, highly respected by all the Jews' — Paul frames his conversion in Jewish terms","'Send you far away to the Gentiles' — the single word 'Gentiles' triggers the riot","Roman citizenship: a legal protection Paul uses strategically — not to avoid all suffering, but to gain a platform"],v:"Then the Lord said to me, 'Go; I will send you far away to the Gentiles' (22:21)"},
      {n:23,t:"Before the Sanhedrin; Plot to Kill Paul; Transfer to Caesarea",badge:"narr",s:"Paul divides the Sanhedrin by raising the resurrection — Pharisees and Sadducees fight each other. A plot is uncovered to ambush and kill Paul. The commander sends Paul to Governor Felix in Caesarea with a large military escort.",args:["Paul plays the Pharisee card deliberately — 'I stand on trial because of the hope of the resurrection' — brilliant rhetorical move","The Lord appears to Paul at night: 'Take courage! As you have testified about me in Jerusalem, so you must also testify in Rome' — the divine plan is confirmed","Forty men take an oath not to eat until they kill Paul — the opposition is organized and lethal","Paul's nephew overhears the plot — God uses ordinary family connections to preserve his servant","The Roman military escort is enormous (470 soldiers) — the empire protects God's apostle to the nations"],v:"Take courage! As you have testified about me in Jerusalem, so you must also testify in Rome (23:11)"},
      {n:24,t:"Paul Before Felix",badge:"disc",s:"The high priest Ananias accuses Paul before Felix. Paul defends himself: he was not causing trouble; his only offense is believing in the resurrection. Felix knows the Way well and postpones judgment. He keeps Paul in custody hoping for a bribe.",args:["Tertullus the lawyer flatters Felix and frames Paul as a troublemaker and ringleader of the Nazarene sect","Paul's defense: he was not disputing or stirring up crowds; no evidence for their charges","'I believe everything that is in accordance with the Law and the Prophets... the same hope these men themselves hold' — Paul claims continuity with Judaism","Felix is disturbed by Paul's talk of righteousness, self-control, and the coming judgment — he sends Paul away","Felix hopes Paul will offer a bribe — Paul does not; he is held two years"],v:"I admit that I worship the God of our ancestors as a follower of the Way, which they call a sect (24:14)"},
      {n:"25–26",t:"Paul Before Festus & Agrippa; Appeal to Caesar",badge:"disc",s:"New governor Festus inherits Paul's case. The Jews want Paul sent to Jerusalem. Paul appeals to Caesar — 'I appeal to Caesar!' Festus brings Paul before King Agrippa. Paul gives his fullest autobiographical defense — Agrippa says Paul almost persuades him.",args:["The appeal to Caesar is Paul's right as a Roman citizen — it also guarantees his journey to Rome (the plan revealed in 23:11)","Festus to Agrippa: the charges are about their own religion and a dead man named Jesus who Paul says is alive","Paul before Agrippa: third account of his conversion; most theologically developed","The commission: open their eyes, turn them from darkness to light, from the power of Satan to God","Festus: 'You are out of your mind, Paul! Your great learning is driving you insane'","Agrippa: 'Do you think that in such a short time you can persuade me to be a Christian?'","Both Festus and Agrippa agree: Paul has done nothing deserving death or imprisonment"],v:"King Agrippa, do you believe the prophets? I know you do (26:27)"},
      {n:27,t:"The Shipwreck",badge:"narr",s:"Paul sails for Rome under guard. A violent storm (Euroclydon/northeaster) batters the ship for fourteen days. Paul encourages the crew with a divine promise. The ship runs aground at Malta. All 276 aboard survive.",args:["Paul warns against sailing — his advice is ignored; the majority overrule wisdom","During the storm: Paul is the calmest person on the ship — the prisoner becomes the leader","An angel appeared: 'God has graciously given you the lives of all who sail with you'","'Keep up your courage, men, for I have faith in God that it will happen just as he told me'","Paul takes bread, gives thanks, and breaks it — the meal in the storm echoes Eucharistic language","The centurion's decision not to kill the prisoners to prevent escape — saved for Paul's sake"],v:"Last night an angel of the God to whom I belong and whom I serve stood beside me and said, 'Do not be afraid, Paul' (27:23-24)"},
      {n:28,t:"Malta; Rome; The Gospel Reaches the End of the Earth",badge:"narr",s:"In Malta, Paul is bitten by a viper and unharmed. He heals many on the island. They reach Rome; Paul lives under house arrest for two years, welcoming all who come and preaching the kingdom of God. The book ends open — the mission continues.",args:["The viper: the crowd assumes Paul is a murderer; then assumes he is a god — Paul is neither; he is an apostle of the true God","Publius's father and others healed — Paul's ministry continues even in shipwreck and captivity","In Rome: Paul meets the Jewish leaders first — consistent pattern throughout Acts","Jews divided: some believe, some don't; Paul cites Isa 6:9-10 — the same passage Jesus cited in Matt 13","The final two years: Paul welcomes all, preaching the kingdom and teaching about Jesus — the mission is not stopped","The book ends without resolution — deliberately open; the mission continues in the reader's own time"],ot:"Isa 6:9-10 (cited as the explanation for Jewish unbelief — a bookend with the Gospels)",v:"He proclaimed the kingdom of God and taught about the Lord Jesus Christ — with all boldness and without hindrance! (28:31)"},
    ]
  },
];

const GENERAL = [
  {
    id:"hebrews", name:"Hebrews",
    meta:"Jewish Christians under pressure to return to Judaism · Jesus is the final and superior fulfillment of everything in the old covenant — don't turn back",
    chapters:[
      {n:1,t:"The Son: Superior to Angels",badge:"ot",s:"God spoke through the prophets but has now spoken through his Son — the radiance of his glory and the exact representation of his being. The Son is superior to angels, who are merely ministering spirits.",args:["The Son is the heir of all things, through whom God made the universe","He is the radiance of God's glory and the exact imprint of his nature — the fullest revelation","After making purification for sins, he sat down at the right hand of the Majesty — his work is complete","Seven OT quotations prove the Son's superiority: angels worship him, his throne is forever, he is Lord","The Son inherits a more excellent name than the angels — the name 'Son'"],ot:"Ps 2:7 (You are my Son); 2 Sam 7:14 (I will be his Father); Ps 97:7 (angels worship him); Ps 45:6-7 (your throne, O God); Ps 102:25-27 (you laid the foundation); Ps 110:1 (sit at my right hand)",v:"The Son is the radiance of God's glory and the exact representation of his being, sustaining all things by his powerful word (1:3)"},
      {n:2,t:"Don't Drift; The Son Became Human",badge:"disc",s:"The first warning: don't drift from what we have heard. The Son became lower than angels to taste death for everyone — identification with humanity was necessary for him to be a merciful high priest.",args:["First warning passage: if the law given through angels was binding, how much more the gospel spoken by the Son?","The world to come is subject to humanity (Ps 8) — Jesus is the representative human who fulfills this","He tasted death for everyone — the scope of the atonement is universal in offer","The pioneer of salvation was made perfect through suffering — suffering is not incidental but essential","He had to be made like his brothers in every way to be a merciful and faithful high priest","He himself suffered when he was tempted — he is able to help those who are being tempted"],ot:"Ps 8:4-6 (what is mankind... crowned with glory); Ps 22:22 (I will declare your name to my brothers); Isa 8:17-18 (here am I and the children God has given me)",v:"Because he himself suffered when he was tempted, he is able to help those who are being tempted (2:18)"},
      {n:3,t:"Jesus Superior to Moses; Warning Against Unbelief",badge:"disc",s:"Moses was faithful as a servant in God's house; Jesus is faithful as the Son over God's house. Second warning: don't harden your hearts as in the wilderness — Israel's unbelief cost them the promised land.",args:["Moses was faithful as a servant; Christ is faithful as a Son — a higher position","We are God's house if we hold firmly to our confidence and the hope we boast in","Second warning: today, if you hear his voice, do not harden your hearts (Ps 95)","Israel's unbelief: they heard but did not combine hearing with faith","The wilderness generation: their bodies fell in the desert because of unbelief — a warning, not a comfort","Encourage one another daily so that none of you may be hardened by sin's deceitfulness"],ot:"Ps 95:7-11 (today if you hear his voice... they shall never enter my rest)",v:"See to it, brothers and sisters, that none of you has a sinful, unbelieving heart that turns away from the living God (3:12)"},
      {n:4,t:"The Rest of God",badge:"disc",s:"The promised rest remains for the people of God — Israel failed to enter it, but the promise still stands. This rest is not just Canaan but the eschatological Sabbath rest of God. The word of God is living and active. Jesus the high priest sympathizes with our weakness.",args:["The rest promised to Israel was not fully realized in Canaan — another day is promised","God rested on the seventh day — his rest is the goal of creation and redemption","The word of God is living and active, sharper than a double-edged sword — it judges the thoughts and attitudes of the heart","Nothing in all creation is hidden from God's sight — we give account to him","We have a great high priest who has passed through the heavens — Jesus the Son of God","He was tempted in every way, just as we are — yet did not sin; therefore approach the throne of grace"],v:"For the word of God is alive and active. Sharper than any double-edged sword (4:12)"},
      {n:5,t:"Jesus as High Priest After Melchizedek",badge:"disc",s:"Every high priest is selected from among men. Jesus did not glorify himself but was appointed by God. He learned obedience through suffering and was made perfect. He is designated a high priest after the order of Melchizedek — but the readers are not ready to hear this yet.",args:["The high priest qualifications: selected from men, appointed on behalf of men, able to deal gently with the ignorant","Jesus met these qualifications: appointed by the Father (Ps 2:7; Ps 110:4), not self-appointed","In the days of his flesh, Jesus offered prayers with loud cries and tears — Gethsemane","He learned obedience from what he suffered — not that he was disobedient, but experiential learning","Made perfect: not morally but in terms of completed qualification to be our priest","The readers are spiritually immature — they need milk, not solid food; they should be teachers by now"],ot:"Ps 2:7 (you are my Son); Ps 110:4 (you are a priest forever after the order of Melchizedek)",v:"Son though he was, he learned obedience from what he suffered and, once made perfect, he became the source of eternal salvation for all who obey him (5:8-9)"},
      {n:6,t:"Warning Against Apostasy; The Anchor of Hope",badge:"disc",s:"Third and most severe warning passage: it is impossible to restore those who have fallen away after receiving the full blessings of the new covenant. But the author is confident of better things. The hope we have is an anchor for the soul — Jesus has entered as our forerunner.",args:["Move on from elementary teachings — repentance, faith, baptisms, laying on of hands, resurrection, judgment","Third warning: those who have been enlightened, tasted the heavenly gift, shared in the Spirit, tasted the word — if they fall away, impossible to restore","They crucify the Son of God all over again and subject him to public disgrace","The land that drinks rain and produces crops vs. thorns and thistles — the same rain, different results","The author is confident of better things in your case — warning does not mean expectation of failure","God's promise and oath: two unchangeable things — the anchor of the soul, firm and secure","Jesus entered the inner sanctuary as our forerunner — Melchizedek connection returns"],v:"We have this hope as an anchor for the soul, firm and secure (6:19)"},
      {n:7,t:"Melchizedek & the New Priesthood",badge:"ot",s:"Melchizedek: king of Salem, priest of the Most High God, without genealogy, without beginning or end of days — he resembles the Son of God. Abraham paid tithes to him, showing Melchizedek's superiority to the Levitical priesthood. Jesus's priesthood supersedes the Levitical.",args:["Melchizedek: king of righteousness, king of peace — his name and title are symbolic","Without father, mother, or genealogy — the silence of Scripture is theologically significant; he stands as an eternal type","Abraham paid tithes to Melchizedek — even Levi (in Abraham's loins) paid tithes to him","If perfection came through the Levitical priesthood, why would another priest be needed? — the law made nothing perfect","Jesus arose from Judah — not a Levite, so his priesthood is on a different basis: the power of an indestructible life","The former commandment is set aside (weak and useless); a better hope is introduced","Jesus is the guarantor of a better covenant — his priesthood is permanent because he lives forever"],ot:"Gen 14:17-20 (Melchizedek meets Abraham); Ps 110:4 (priest forever after the order of Melchizedek)",v:"Therefore he is able to save completely those who come to God through him, because he always lives to intercede for them (7:25)"},
      {n:8,t:"The Better Covenant",badge:"ot",s:"Jesus ministers in the true tabernacle in heaven — the earthly tabernacle was only a copy and shadow. He is the mediator of a better covenant, enacted on better promises. The old covenant is obsolete — Jeremiah himself predicted a new covenant.",args:["We have such a high priest who sat down at the right hand of the throne of the Majesty in heaven","He serves in the sanctuary that is the true tabernacle set up by the Lord, not a human being","Moses was told to make the tabernacle according to the pattern shown on the mountain — it was always a copy","The better covenant is founded on better promises — not the fault of the people (the law), but its limitation","Jeremiah 31 predicts a new covenant: I will put my laws in their minds, write them on their hearts; all will know me; I will forgive their sins","By calling this covenant 'new,' he has made the first one obsolete"],ot:"Exod 25:40 (make it according to the pattern); Jer 31:31-34 (the new covenant — the longest OT quote in the NT)",v:"The ministry Jesus has received is as superior to theirs as the covenant of which he is mediator is superior to the old one (8:6)"},
      {n:9,t:"The Blood of Christ: Once for All",badge:"ot",s:"The earthly tabernacle with its regulations — only the high priest enters the Most Holy Place, once a year, with blood. This is a parable for the present time. But Christ entered once for all through his own blood, securing eternal redemption.",args:["The first covenant: the tabernacle layout — the outer Holy Place, the inner Most Holy Place, the curtain","The high priest enters the Most Holy Place once a year with blood — he must atone for his own sins too","The Holy Spirit shows that the way into the Most Holy Place had not yet been disclosed","Christ came as high priest of the good things that are now here — through his own blood, not animal blood","The blood of goats and bulls sanctifies for external purity — how much more will the blood of Christ cleanse the conscience","He is the mediator of the new covenant: redemption from sins committed under the first covenant","He has appeared once for all at the culmination of the ages to do away with sin by the sacrifice of himself"],ot:"Exod 24:8 (Moses sprinkles covenant blood); Lev 16 (Day of Atonement — the whole chapter is the background)",v:"How much more, then, will the blood of Christ, who through the eternal Spirit offered himself unblemished to God, cleanse our consciences from acts that lead to death (9:14)"},
      {n:10,t:"The Final Sacrifice & Fourth Warning",badge:"disc",s:"The law is only a shadow — the same sacrifices year after year can never make perfect. But Christ's one sacrifice perfects forever those who are being made holy. The curtain is opened. Fourth warning: if we deliberately keep sinning, no sacrifice remains. Hold on!",args:["The law is a shadow, not the reality — the annual repetition proves it cannot perfect","It is impossible for the blood of bulls and goats to take away sins","'Here I am — I have come to do your will, O God' (Ps 40) — Christ's offering of himself was voluntary and obedient","By one sacrifice he has perfected forever those who are being made holy — the contrast with annual repetition","The curtain is opened — we have confidence to enter the Most Holy Place by the blood of Jesus","Fourth warning: if we deliberately sin after receiving the knowledge of truth, no sacrifice remains — only fearful expectation of judgment","Do not throw away your confidence; you need to persevere — just a little while and the coming one will come"],ot:"Ps 40:6-8 (sacrifice and offering you did not desire — here I am); Jer 31:33 (their sins I will remember no more); Hab 2:3-4 (the coming one; the righteous will live by faith)",v:"Let us hold unswervingly to the hope we profess, for he who promised is faithful (10:23)"},
      {n:11,t:"The Hall of Faith",badge:"disc",s:"Faith is confidence in what we hope for and assurance about what we do not see. A long catalog of Old Testament believers who lived and died by faith, not having received what was promised — they were looking ahead to the same fulfillment we now have.",args:["Faith definition: confidence in what we hope for, assurance about what we do not see","By faith the universe was formed at God's command — creation ex nihilo is received by faith","Abel, Enoch, Noah, Abraham, Sarah, Isaac, Jacob, Joseph, Moses, Rahab — each story shows faith acting on unseen promises","Abraham: went without knowing where; offered up Isaac believing in resurrection","Moses: chose to be mistreated with the people of God rather than enjoy Egypt's pleasures; regarded disgrace for the Messiah as greater wealth","The world was not worthy of them — they wandered in deserts; they died without receiving the promises","God had planned something better for us — they would not be made perfect apart from us"],v:"Now faith is confidence in what we hope for and assurance about what we do not see (11:1)"},
      {n:12,t:"Run the Race; The Fifth Warning; Mount Sinai vs. Mount Zion",badge:"disc",s:"Surrounded by the cloud of witnesses, fix your eyes on Jesus who endured the cross for the joy set before him. Discipline is evidence of sonship. Fifth warning: don't refuse him who speaks — the contrast between terrifying Sinai and glorious Zion.",args:["Throw off everything that hinders and the sin that so easily entangles — run with perseverance","Fix your eyes on Jesus, the pioneer and perfecter of faith — he endured the cross, despising the shame","Discipline: God treats you as sons; if you are without discipline, you are illegitimate children","Make level paths for your feet — strengthen feeble arms and weak knees","Pursue holiness; without it no one will see the Lord","Sinai: fire, darkness, storm, terrifying voice — the people begged that no more be spoken","Zion: the heavenly Jerusalem, thousands of angels, the spirits of the righteous made perfect, Jesus the mediator of the new covenant","Fifth warning: if they did not escape when they refused the earthly voice, how much less will we if we turn away from the heavenly one?"],v:"Let us fix our eyes on Jesus, the pioneer and perfecter of faith, who for the joy set before him endured the cross, scorning its shame (12:2)"},
      {n:13,t:"Final Exhortations & Benediction",badge:"disc",s:"Practical exhortations: love one another, show hospitality, remember prisoners, honor marriage, be free from the love of money. Obey your leaders. Jesus suffered outside the gate — go to him outside the camp. The great benediction.",args:["Keep on loving one another as brothers and sisters","Show hospitality to strangers — some have entertained angels without knowing it","Marriage should be honored by all; God will judge the sexually immoral","Keep your lives free from the love of money — 'Never will I leave you; never will I forsake you' (Deut 31:6)","Jesus suffered outside the city gate to make the people holy — go to him outside the camp, bearing his disgrace","Here we do not have an enduring city, but we are looking for the city that is to come","The great benediction: the God of peace, who brought back the great Shepherd, equip you with everything good"],ot:"Deut 31:6 ('Never will I leave you'); Ps 118:6 (the Lord is my helper); Ps 110:1 (implicit in the Shepherd imagery)",v:"May the God of peace, who through the blood of the eternal covenant brought back from the dead our Lord Jesus, that great Shepherd of the sheep, equip you with everything good (13:20-21)"},
    ]
  },
  {
    id:"james", name:"James",
    meta:"The twelve tribes scattered among the nations · Authentic faith must produce works — a practical wisdom epistle",
    chapters:[
      {n:1,t:"Trials, Wisdom, Temptation & Doing the Word",badge:"disc",s:"Consider it joy when you face trials — testing produces perseverance. Ask God for wisdom without doubting. God does not tempt anyone — temptation comes from our own desires. Be quick to listen, slow to speak. Be doers of the word, not hearers only.",args:["Trials: the testing of faith produces perseverance; perseverance must finish its work so you may be mature and complete","Ask for wisdom in faith — the doubter is like a wave of the sea, unstable in all they do","Rich and poor: the rich should boast in humiliation; the poor in their exaltation — worldly status is reversed","God does not tempt anyone — temptation comes from one's own desire, which gives birth to sin, which gives birth to death","Every good and perfect gift is from above — from the Father of lights who does not change","Be quick to listen, slow to speak, slow to become angry — human anger does not produce God's righteousness","Be doers of the word, not hearers only — the person who hears but does not do is like someone who looks in a mirror and forgets"],v:"Do not merely listen to the word, and so deceive yourselves. Do what it says (1:22)"},
      {n:2,t:"Favoritism Forbidden; Faith Without Works is Dead",badge:"disc",s:"Don't show favoritism to the rich in your assembly. The royal law: love your neighbor as yourself. Faith without deeds is dead — even the demons believe and shudder. Abraham and Rahab show that faith and deeds work together.",args:["Showing favoritism to the rich and dishonoring the poor violates the royal law","If you break one point of the law, you are guilty of all — the law is a unity","Speak and act as those who will be judged by the law that gives freedom","Faith without works is dead — what good is it to say 'Go in peace' without meeting the need?","Even demons believe there is one God and shudder — mere intellectual belief is not saving faith","Abraham: his faith was made complete by what he did when he offered Isaac — faith and works cooperate","Rahab: justified by what she did when she hid the spies","As the body without the spirit is dead, so faith without deeds is dead"],v:"As the body without the spirit is dead, so faith without deeds is dead (2:26)"},
      {n:3,t:"Taming the Tongue; Two Kinds of Wisdom",badge:"disc",s:"Not many should become teachers — stricter judgment. The tongue is a small thing with enormous power — a fire that corrupts the whole body. No one can tame it. Two kinds of wisdom: earthly (envy, selfish ambition) and from above (pure, peace-loving, full of mercy).",args:["We all stumble in many ways — the person who controls their tongue controls their whole body","The tongue is a small spark that sets a great forest on fire","It is a restless evil, full of deadly poison — we praise God and curse people made in God's image with the same tongue","Fresh and salt water cannot flow from the same spring — neither should blessing and cursing come from the same mouth","Earthly wisdom: bitter envy and selfish ambition — disorder and every evil practice","Wisdom from above: first pure, then peace-loving, considerate, submissive, full of mercy and good fruit, impartial and sincere"],v:"The wisdom that comes from heaven is first of all pure; then peace-loving, considerate, submissive, full of mercy and good fruit, impartial and sincere (3:17)"},
      {n:4,t:"Worldliness, Humility & Not Judging",badge:"disc",s:"Fights and quarrels come from desires at war within you. You don't have because you don't ask — or ask with wrong motives. Friendship with the world is enmity with God. Humble yourselves. Don't slander or judge one another. Don't boast about your plans.",args:["Quarrels and fights: from the desires that battle within — you kill and covet but cannot get what you want","You don't have because you don't ask; you ask and don't receive because you ask with wrong motives","Friendship with the world means enmity against God — you cannot have both","God opposes the proud but gives grace to the humble — submit to God, resist the devil","Come near to God and he will come near to you — wash your hands, purify your hearts","Do not slander or judge one another — there is only one Lawgiver and Judge","Boasting about tomorrow is arrogance — you are a mist; say 'If the Lord wills'"],v:"God opposes the proud but shows favor to the humble (4:6)"},
      {n:5,t:"Warning to the Rich; Patience & Prayer",badge:"disc",s:"Woe to the rich who have hoarded wealth and oppressed workers. Be patient like the farmer waiting for rain. Don't grumble against one another. Elijah prayed and it did not rain — the prayer of a righteous person is powerful and effective.",args:["The rich: their gold and silver are corroded — a witness against them; they have fattened themselves for the day of slaughter","The wages of the workers are crying out against them — the Lord Almighty has heard","Be patient and stand firm — the Lord's coming is near; the farmer waits for the autumn and spring rains","Don't grumble against one another or you will be judged — the Judge is standing at the door","The prayer of a righteous person is powerful and effective — Elijah's example","If one of you wanders from the truth and is brought back, you save them from death and cover a multitude of sins"],v:"The prayer of a righteous person is powerful and effective (5:16)"},
    ]
  },
  {
    id:"1pet", name:"1 Peter",
    meta:"Elect exiles scattered throughout Asia Minor · Suffering is not a sign of God's absence — it is the path of the Messiah and the refining fire for holy living",
    chapters:[
      {n:1,t:"Living Hope & Call to Holiness",badge:"disc",s:"Praise God for the living hope through the resurrection. Though you suffer grief now, your faith — more precious than gold — is being refined. The prophets searched intently for this salvation. Therefore be holy, as God is holy.",args:["Elect exiles: chosen according to the foreknowledge of God the Father, sanctified by the Spirit, sprinkled with Christ's blood","A living hope through the resurrection of Jesus — an inheritance that can never perish, spoil, or fade","Trials: the testing of your faith — more precious than gold — results in praise, glory, and honor at Christ's revelation","The prophets searched intently and carefully for this salvation — they were serving you","Prepare your minds for action; be sober-minded; set your hope on the grace to be given at Christ's revelation","Be holy in all you do, as he who called you is holy (Lev 11:44)","You were redeemed not with silver or gold but with the precious blood of Christ, a lamb without blemish"],ot:"Lev 11:44 (be holy because I am holy); Isa 53:7 (lamb without blemish)",v:"In his great mercy he has given us new birth into a living hope through the resurrection of Jesus Christ from the dead (1:3)"},
      {n:2,t:"Living Stones; Chosen People; Submission",badge:"disc",s:"You are living stones being built into a spiritual house. You are a chosen people, a royal priesthood. As foreigners and exiles, abstain from sinful desires. Submit to every human authority — for the Lord's sake. Christ suffered, leaving you an example.",args:["Come to the living Stone — rejected by humans but chosen by God — and you are living stones being built into a spiritual house","A chosen people, a royal priesthood, a holy nation, God's special possession — the Exodus identities transferred to the church","'Once you were not a people; now you are the people of God' — Gentile inclusion echoes Hosea","As foreigners and exiles, abstain from sinful desires — your good deeds will cause them to glorify God","Submit to every human authority: the emperor, governors — for the Lord's sake, not from fear","Christ suffered for you, leaving you an example — he did not retaliate; he entrusted himself to the just Judge"],ot:"Isa 28:16 (the precious cornerstone); Ps 118:22 (stone the builders rejected); Exod 19:6 (kingdom of priests); Hos 1:9-10; 2:23 (not my people / my people)",v:"But you are a chosen people, a royal priesthood, a holy nation, God's special possession (2:9)"},
      {n:3,t:"Household Code; Suffering for Doing Good; Always Ready",badge:"disc",s:"Wives and husbands. All: live in harmony, be compassionate and humble. If you suffer for doing good, you are blessed. Always be prepared to give an answer for the hope you have. Christ suffered once for sins — the just for the unjust.",args:["Wives: submit to husbands, even unbelieving ones — your conduct may win them without words","Beauty from the inside — a gentle and quiet spirit is of great worth in God's sight","Husbands: be considerate; treat your wives with respect as heirs together of the grace of life","Live in harmony; be sympathetic, compassionate, humble; don't repay evil with evil","Always be prepared to give an answer to everyone who asks for the reason for the hope you have — with gentleness and respect","Christ suffered once for sins, the just for the unjust, to bring you to God — then he was made alive in the Spirit"],ot:"Ps 34:12-16 (whoever would love life... seek peace and pursue it); Isa 8:12-13 (do not fear what they fear)",v:"Always be prepared to give an answer to everyone who asks you to give the reason for the hope that you have (3:15)"},
      {n:4,t:"Suffering as a Christian",badge:"disc",s:"Whoever suffers in the body is done with sin. Don't be surprised at the fiery ordeal — rejoice that you participate in the sufferings of Christ. If you are insulted because of the name of Christ, you are blessed. Judgment begins with God's household.",args:["Arm yourself with the same attitude as Christ who suffered — those who suffer in the body are done with sin","The time you have left should be spent on God's will, not human desires","Don't be surprised at the painful trial — as if something strange were happening to you","Rejoice that you participate in Christ's sufferings, so that you may be overjoyed when his glory is revealed","If you suffer as a Christian, do not be ashamed — praise God that you bear that name","Judgment begins with God's household — if it begins with us, what will the outcome be for those who disobey the gospel?"],v:"Dear friends, do not be surprised at the fiery ordeal that has come on you to test you, as though something strange were happening to you (4:12)"},
      {n:5,t:"Elders, Humility & the Devil",badge:"disc",s:"Elders: be shepherds, not lording it over those entrusted to you. All of you: clothe yourselves in humility toward one another. Be alert — your enemy the devil prowls like a roaring lion. Resist him, firm in the faith. The God of all grace will restore you.",args:["Elders: shepherd the flock willingly, not because you must; not for money; not lording it over — be examples","The Chief Shepherd will appear and you will receive the crown of glory that will not fade","Clothe yourselves with humility toward one another — God opposes the proud","Humble yourselves under God's mighty hand — he will lift you up in due time","Cast all your anxiety on him because he cares for you","Your enemy the devil prowls around like a roaring lion looking for someone to devour — resist him, firm in the faith","The same kind of sufferings are being experienced by your brothers and sisters throughout the world — you are not alone"],v:"Cast all your anxiety on him because he cares for you (5:7)"},
    ]
  },
  {
    id:"2pet", name:"2 Peter",
    meta:"The same audience as 1 Peter · Guard the faith against false teachers; the Day of the Lord is certain",
    chapters:[
      {n:1,t:"Make Your Calling Sure; The Prophetic Word",badge:"disc",s:"God's divine power has given us everything we need for life and godliness. Add to your faith a chain of virtues. Make your calling and election sure. The transfiguration confirms the prophetic word — more certain than an eyewitness account.",args:["His divine power has given everything needed for life and godliness through the knowledge of him","Participate in the divine nature — escape the corruption caused by evil desires","Add to faith: goodness, knowledge, self-control, perseverance, godliness, mutual affection, love","If you do not have these qualities you are nearsighted and blind — you have forgotten your cleansing","Make your calling and election sure — you will receive a rich welcome into the eternal kingdom","Peter was an eyewitness of the transfiguration — 'This is my Son, whom I love, with him I am well pleased'","The prophetic word is more certain still — no prophecy comes from personal interpretation; it comes from God as the Spirit carries the speaker"],v:"Make every effort to add to your faith goodness; and to goodness, knowledge; and to knowledge, self-control (1:5-6)"},
      {n:2,t:"False Teachers: Warning & Judgment",badge:"disc",s:"False teachers will secretly introduce destructive heresies, denying the sovereign Lord. God did not spare angels, Sodom, or the world of Noah — he knows how to rescue the godly and hold the unrighteous for judgment. These false teachers are like Balaam.",args:["False teachers will bring in destructive heresies, denying the Master who bought them","Many will follow their depraved conduct — the way of truth will be brought into disrepute","Three examples of judgment: angels who sinned (imprisoned), the ancient world (the flood), Sodom and Gomorrah","And three examples of rescue: Noah, Lot — God knows how to rescue the godly from trials","These teachers follow corrupt desire, despise authority, are bold and arrogant — they blaspheme what they don't understand","Balaam loved the wages of wickedness — an animal rebuked his madness","They promise freedom while they themselves are slaves of depravity"],v:"The Lord knows how to rescue the godly from trials and to hold the unrighteous for punishment on the day of judgment (2:9)"},
      {n:3,t:"The Day of the Lord & New Creation",badge:"disc",s:"Scoffers will come saying 'Where is his coming?' But one day is like a thousand years to God — he is not slow, but patient. The Day of the Lord will come like a thief. Everything will be destroyed and remade. Live holy and godly lives as you look forward to the new heaven and new earth.",args:["In the last days scoffers will say 'Where is this coming he promised? Everything goes on as it always has'","They deliberately forget: God judged the world once by water — he will judge again by fire","With the Lord a day is like a thousand years — he is not slow as some understand slowness; he is patient","He is not willing that any should perish but that all come to repentance","The Day of the Lord will come like a thief — the elements will be destroyed by fire","We are looking forward to a new heaven and a new earth, where righteousness dwells","Paul's letters are hard to understand — some distort them, as they do the other Scriptures"],v:"The Lord is not slow in keeping his promise... Instead he is patient with you, not wanting anyone to perish, but everyone to come to repentance (3:9)"},
    ]
  },
  {
    id:"1john", name:"1 John",
    meta:"The churches under John's care · Assurance of salvation; love one another; test the spirits",
    chapters:[
      {n:1,t:"The Word of Life & Walking in the Light",badge:"disc",s:"The prologue: that which was from the beginning, which we have heard and seen and touched — the Word of life. Fellowship with the Father and the Son. If we walk in the darkness we lie. If we confess our sins, he is faithful and just to forgive.",args:["The testimony is eyewitness and physical — heard, seen, looked at, touched — against docetism (the heresy that Jesus only appeared human)","Fellowship with the Father and with his Son Jesus Christ — the proclamation is for the readers' joy","God is light; in him there is no darkness at all","If we claim to have fellowship with him yet walk in darkness, we lie","If we walk in the light, we have fellowship with one another, and the blood of Jesus purifies us from all sin","If we claim to be without sin, we deceive ourselves; the truth is not in us","If we confess our sins, he is faithful and just to forgive us and to purify us from all unrighteousness"],v:"If we confess our sins, he is faithful and just and will forgive us our sins and purify us from all unrighteousness (1:9)"},
      {n:2,t:"Jesus Our Advocate; Love and Hate; Antichrists",badge:"disc",s:"We have an advocate with the Father — Jesus Christ the righteous. We know him if we keep his commandments. Anyone who loves the world does not have the Father's love. Many antichrists have come — they went out from us but were not of us.",args:["We have an advocate with the Father — Jesus Christ the Righteous One; he is the atoning sacrifice for our sins, and not only ours but the whole world","We know him if we keep his commandments — anyone who claims to know him but disobeys lies","Anyone who loves their brother lives in the light; anyone who hates their brother is in the darkness","Do not love the world or anything in the world — the lust of the flesh, the lust of the eyes, the pride of life","The world and its desires pass away — but whoever does the will of God lives forever","Many antichrists have come — they went out from us because they were not of us","You have an anointing from the Holy One — you all know the truth"],v:"Do not love the world or anything in the world. If anyone loves the world, love for the Father is not in them (2:15)"},
      {n:3,t:"Children of God; Love One Another",badge:"disc",s:"See what great love the Father has lavished on us — we are called children of God. We shall be like him when he appears. Everyone who sins practices lawlessness. We love one another because he first loved us — this is how we know we belong to the truth.",args:["See what great love the Father has lavished on us — that we should be called children of God!","What we will be has not yet been made known; but we know that when he appears we shall be like him","Everyone who has this hope purifies himself, just as he is pure","The reason the Son of God appeared: to destroy the devil's work","No one who is born of God will continue to sin — this is how we tell the children of God and the children of the devil apart","Do not be like Cain, who murdered his brother — anyone who hates his brother is a murderer","We know what love is: Jesus Christ laid down his life for us — we ought to lay down our lives for one another","Let us not love with words or tongue but with actions and in truth — by this we know we belong to the truth"],v:"This is how we know what love is: Jesus Christ laid down his life for us. And we ought to lay down our lives for our brothers and sisters (3:16)"},
      {n:4,t:"Test the Spirits; God Is Love",badge:"disc",s:"Test every spirit — not every spirit is from God. The spirit of the antichrist does not acknowledge that Jesus has come in the flesh. God is love — whoever lives in love lives in God. Perfect love drives out fear.",args:["Do not believe every spirit — test the spirits to see whether they are from God","The test: every spirit that acknowledges that Jesus Christ has come in the flesh is from God","The spirit of the antichrist denies the incarnation — it was already in the world","You, dear children, are from God — the one in you is greater than the one in the world","God is love — not merely that he loves, but that his very nature is love","This is love: not that we loved God, but that he loved us and sent his Son as an atoning sacrifice","No one has ever seen God, but if we love one another, God lives in us","There is no fear in love; perfect love drives out fear — fear has to do with punishment","We love because he first loved us"],v:"There is no fear in love. But perfect love drives out fear (4:18)"},
      {n:5,t:"Overcoming the World; Assurance; Eternal Life",badge:"disc",s:"Everyone born of God overcomes the world — this is the victory: our faith. Jesus came by water and blood. The testimony of God is greater than human testimony: God has given us eternal life in his Son. We know that we have eternal life.",args:["Everyone born of God overcomes the world — the victory is our faith","Who overcomes the world? Only the one who believes that Jesus is the Son of God","Jesus came by water and blood — not by water only, but by water and blood (against those who denied the full incarnation and atoning death)","There are three that testify: the Spirit, the water, and the blood","Anyone who believes in the Son of God accepts this testimony; anyone who does not makes God out to be a liar","I write these things to you who believe in the name of the Son of God so that you may know that you have eternal life","If we ask anything according to his will, he hears us","There is a sin that leads to death — John does not say to pray for that; all wrongdoing is sin, but not all sin leads to death"],v:"I write these things to you who believe in the name of the Son of God so that you may know that you have eternal life (5:13)"},
    ]
  },
  {
    id:"2john", name:"2 John",
    meta:"The elect lady and her children (a local church) · Walk in love and truth; do not welcome deceivers",
    chapters:[
      {n:1,t:"Truth, Love & Warning Against Deceivers",s:"A brief letter from the elder to the elect lady. Walk in love — this is the command from the beginning. Many deceivers have gone out into the world who do not acknowledge Jesus Christ as coming in the flesh. Do not welcome them or you share in their wicked work.",args:["The elder writes to the elect lady and her children who walk in truth","Love one another — this is the command from the beginning","Many deceivers have gone out into the world: they do not acknowledge that Jesus Christ has come in the flesh","Anyone who runs ahead and does not continue in the teaching of Christ does not have God","Do not take such a person into your house or even greet them — hospitality to false teachers makes you a partner in their work","The letter closes with a promise to visit rather than write — some things are better said face to face"],v:"Anyone who runs ahead and does not continue in the teaching of Christ does not have God; whoever continues in the teaching has both the Father and the Son (v.9)"},
    ]
  },
  {
    id:"3john", name:"3 John",
    meta:"Gaius, a church leader · Hospitality to traveling teachers; warning against Diotrephes",
    chapters:[
      {n:1,t:"Gaius Commended; Diotrephes Rebuked; Demetrius Recommended",s:"The elder writes to his dear friend Gaius — he prays Gaius is as healthy as his soul is. Gaius has shown hospitality to traveling missionaries. Diotrephes loves to be first, refuses the elder's authority, and throws people out of the church. Demetrius is recommended.",args:["Gaius's soul is doing well — John prays his physical health matches his spiritual health","Gaius has shown hospitality to strangers (traveling missionaries) — you will do well to send them on in a manner worthy of God","They went out for the sake of the Name, receiving nothing from the pagans — the church is responsible to support them","Diotrephes: loves to be first; rejects the elder's authority; spreading malicious nonsense; refusing to welcome the brothers; throwing them out of the church","Do not imitate what is evil but what is good — whoever does good is from God","Demetrius is commended by everyone, by the truth itself"],v:"Dear friend, do not imitate what is evil but what is good. Anyone who does what is good is from God (v.11)"},
    ]
  },
  {
    id:"jude", name:"Jude",
    meta:"All who are called, loved, and kept · Contend for the faith; remember God has always judged the ungodly and will again",
    chapters:[
      {n:1,t:"Contend for the Faith; Judgment on False Teachers; Doxology",badge:"ot",s:"Jude intended to write about salvation but was compelled to urge the readers to contend for the faith because ungodly people have slipped in. Three OT examples of judgment. The false teachers are described vividly. Build yourselves up in faith; be merciful to the doubting.",args:["Certain people have secretly slipped in — ungodly people who pervert grace into a license for immorality and deny Jesus","Three examples of judgment: Israel in the wilderness (unbelief), the fallen angels (Enoch and 1 Enoch tradition), Sodom and Gomorrah","These false teachers follow the way of Cain, Balaam's error, and Korah's rebellion — three OT rebels","They are blemishes at your love feasts: shepherds who feed only themselves, clouds without rain, twice-dead trees pulled up by the roots","Enoch prophesied: 'See, the Lord is coming with thousands of his holy ones to judge'","Build yourselves up in the most holy faith; pray in the Holy Spirit; keep yourselves in God's love; wait for Christ's mercy","Be merciful to those who doubt; save others by snatching them from the fire","The doxology: to him who is able to keep you from stumbling and present you before his glorious presence without fault — to the only God our Savior be glory"],ot:"Num 14 (Israel's unbelief); Gen 6:1-4 / 1 Enoch (fallen angels); Gen 19 (Sodom); Cain (Gen 4); Balaam (Num 22-25); Korah (Num 16); Enoch's prophecy (1 Enoch 1:9)",v:"To him who is able to keep you from stumbling and to present you before his glorious presence without fault and with great joy — to the only God our Savior be glory, majesty, power and authority (v.24-25)"},
    ]
  },
];

const REVELATION = [
  {
    id:"r1", name:"Letters to the Churches (1–3)",
    meta:"The risen Christ evaluates seven real churches — calling each to repent, endure, or hold fast; he stands at the door and knocks",
    chapters:[
      {n:1,t:"The Vision of the Risen Christ",badge:"ot",s:"The revelation of Jesus Christ given to John on Patmos. John hears a loud voice and turns to see one like a son of man — blazing eyes, feet like bronze, a double-edged sword from his mouth. John falls at his feet as though dead.",args:["The revelation is from Jesus Christ, given to him by God, to show his servants what must soon take place","Blessed is the one who reads aloud the words of this prophecy — the only NT book with this explicit blessing","I am the Alpha and the Omega, who is and who was and who is to come — divine self-identification","John is in the Spirit on the Lord's Day — exiled on Patmos","The vision of the risen Christ: white hair, blazing eyes, feet of bronze, voice like rushing waters, seven stars, double-edged sword","'I am the First and the Last. I am the Living One; I was dead, and now look, I am alive for ever and ever'","The seven stars are the seven angels of the churches; the seven lampstands are the seven churches"],ot:"Dan 7:13 (one like a son of man); Dan 10:5-6 (the figure in the vision: white, bronze, fire); Isa 44:6 (the first and the last)",v:"I am the Living One; I was dead, and now look, I am alive for ever and ever! And I hold the keys of death and Hades (1:18)"},
      {n:"2–3",t:"Letters to the Seven Churches",badge:"disc",s:"Seven letters to seven real churches: Ephesus (left first love), Smyrna (faithful in suffering), Pergamum (compromising with false teaching), Thyatira (tolerating Jezebel), Sardis (dead reputation), Philadelphia (open door, little strength), Laodicea (lukewarm — I will spit you out).",args:["Each letter follows a pattern: Christ's self-description, commendation, rebuke, call, promise to the overcomer","Ephesus: doctrinally sound but has forsaken its first love — return, or the lampstand will be removed","Smyrna: suffering and poor, yet rich — do not be afraid of what you are about to suffer; be faithful even to death","Pergamum: where Satan's throne is — some hold to Balaam's teaching (sexual immorality and food offered to idols)","Thyatira: the most commended for love, faith, service — but tolerates Jezebel the false prophetess","Sardis: has a reputation of being alive but is dead — strengthen what remains; I have not found your deeds complete","Philadelphia: little strength but has kept my word and not denied my name — an open door no one can shut","Laodicea: neither hot nor cold — lukewarm; self-satisfied; wretched, pitiful, poor, blind, naked; I stand at the door and knock"],v:"Here I am! I stand at the door and knock. If anyone hears my voice and opens the door, I will come in and eat with that person (3:20)"},

  {
    id:"r2", name:"The Throne & Seals (4–7)",
    meta:"Heaven's throne room revealed — the Lamb alone is worthy to open the seals; martyrs, horsemen, and the sealed multitude",
    chapters:[
      {n:4,t:"The Throne Room of Heaven",badge:"ot",s:"A door open in heaven — John is taken up in the Spirit. He sees the throne of God with its rainbow, the twenty-four elders, the four living creatures. The living creatures never stop saying 'Holy, holy, holy is the Lord God Almighty.'",args:["The throne room vision establishes who is truly sovereign before the judgments begin","The rainbow around the throne echoes the Noahic covenant — God's judgment is always bounded by mercy","Twenty-four elders: probably representative of the twelve tribes plus the twelve apostles (the full people of God)","Four living creatures: lion, ox, man, eagle — recalling Ezekiel's cherubim; full of eyes; the perfect worshipers","Their song: 'Holy, holy, holy is the Lord God Almighty, who was, and is, and is to come'","The elders cast their crowns before the throne: 'You are worthy, our Lord and God, to receive glory and honor and power'"],ot:"Ezek 1 (the four living creatures/cherubim); Isa 6:3 (Holy, Holy, Holy); Dan 7:9-10 (the Ancient of Days on the throne)",v:"You are worthy, our Lord and God, to receive glory and honor and power, for you created all things (4:11)"},
      {n:5,t:"The Lamb Who Was Slain Is Worthy",badge:"ot",s:"A scroll sealed with seven seals — who is worthy to open it? No one. John weeps. Then: the Lion of Judah, the Root of David, has triumphed. He appears as a Lamb looking as if it had been slain. The four living creatures and twenty-four elders fall down in worship. Every creature in heaven and earth joins.",args:["The sealed scroll represents God's redemptive plan for history — only the worthy one can execute it","The Lamb standing as if slain: the crucifixion is the defining moment of all reality; the risen Christ still bears the marks","Seven horns (complete power) and seven eyes (complete wisdom) — the fullness of divine attributes","The new song: 'You are worthy... because you were slain, and with your blood you purchased for God persons from every tribe and language and people and nation'","The redeemed are a kingdom and priests to serve our God — Exodus 19:6 applied to the church from every nation","Worthy is the Lamb — the crescendo of the entire chapter; ten thousand times ten thousand worship"],ot:"Gen 49:9 (the Lion of Judah); Isa 11:1 (the Root of Jesse/David); Isa 53:7 (led like a lamb to slaughter); Dan 7:13-14 (receiving the scroll / dominion)",v:"Worthy is the Lamb, who was slain, to receive power and wealth and wisdom and strength and honor and glory and praise! (5:12)"},
      {n:"6–7",t:"The Six Seals & The Sealed Multitude",badge:"ot",s:"The Lamb opens six seals: the four horsemen (conquest, war, famine, death), the souls of martyrs under the altar, cosmic signs of the final judgment. Then an interlude: 144,000 sealed from Israel, and a great multitude from every nation robed in white — those who came out of the great tribulation.",args:["The four horsemen: white (conquest), red (war), black (famine — a day's wages for a quart of wheat), pale (death)","Martyrs under the altar: 'How long, Sovereign Lord, until you judge and avenge our blood?' — given white robes; told to wait a little longer","The sixth seal: earthquake, sun black, moon red, stars fall, sky rolled up — the day of wrath has come; who can withstand it?","The 144,000: 12,000 from each tribe — symbolic completeness of God's preserved people","The great multitude: from every nation, tribe, people, and language — too great to count, robed in white","'These are they who have come out of the great tribulation; they have washed their robes and made them white in the blood of the Lamb'","God will wipe away every tear — he will shepherd them and lead them to springs of living water"],ot:"Zech 1:8-11; 6:1-8 (four horsemen/chariots); Isa 34:4 (the sky rolled up like a scroll); Ezek 9:4-6 (the seal on foreheads of the righteous)",v:"They have washed their robes and made them white in the blood of the Lamb (7:14)"},
    ]
  },
  {
    id:"r3", name:"Trumpets & Witnesses (8–11)",
    meta:"Seven trumpets escalate judgment — demonic locusts, a 200-million army, two witnesses raised; the kingdom is declared",
    chapters:[
      {n:"8–9",t:"The Seven Trumpets",badge:"ot",s:"The seventh seal opens — silence in heaven for half an hour. Seven trumpets announce escalating judgments: hail and fire (a third of the earth burned), a great mountain thrown into the sea, a star falls (Wormwood), the sun dimmed. Then demonic locusts and a cavalry of 200 million. Yet the rest of humanity did not repent.",args:["The silence in heaven: a dramatic pause before the next wave of judgments; the prayers of the saints rise with incense","The first four trumpets parallel the Egyptian plagues — but on a cosmic scale","Wormwood: a star falls and makes the waters bitter — one-third of people die from the water","Three woes announced: the last three trumpets are especially severe","Demonic locusts from the Abyss: not to harm the grass but to torment for five months those without God's seal","The sixth trumpet releases four angels at the Euphrates — 200 million cavalry; a third of mankind killed by fire, smoke, and sulfur","The rest still did not repent of their idolatry and murders — hardening despite judgment"],ot:"Exod 7–10 (the plagues of Egypt are the typological background throughout the trumpet sequence); Joel 2:4-10 (the locust army)",v:"The rest of mankind who were not killed by these plagues still did not repent of the work of their hands (9:20)"},

    crossrefs:["John 1:1","Romans 9:5","Titus 2:13","Hebrews 1:8","Philippians 2:9–11"],
    apologetics:"The most direct address of Jesus as God in the NT, by a disciple who had just seen the crucifixion wounds. If Jesus were not God, accepting this address would be blasphemy — yet Jesus accepts it and pronounces blessing. This is the testimony of an eyewitness who had good reason to be skeptical.",
    misuse:"Jehovah's Witnesses argue Thomas was speaking to God (the Father) in an exclamation, not addressing Jesus. But the Greek 'he said to him' (eipen autō) makes Jesus the referent of the address, and Jesus' response to Thomas confirms he received it.",
    transNote:"'Ho theos mou' — with the definite article, this is not an exclamation ('Oh God!') but a direct address: 'My God.' Both nouns have the article, making the identification explicit and deliberate."
  },
  {
    ref:"Colossians 1:15-17",
    text:"He is the image of the invisible God, the firstborn of all creation. For by him all things were created, in heaven and on earth, visible and invisible, whether thrones or dominions or rulers or authorities — all things were created through him and for him. And he is before all things, and in him all things hold together.",
    cat:"Apologetics — Deity of Christ",
    context:"Colossians 1:15–20, the Christ hymn responding to the Colossian heresy that apparently placed spiritual intermediaries between God and creation.",

    misuse:"'Firstborn of all creation' used to teach Christ is a created being (Arianism, JWs). Verse 16 immediately rules this out: 'for by him all things were created.' The 'for' (hoti) gives the reason for his firstborn status — he is prior to and sovereign over creation as its creator.",
    transNote:"'Firstborn' (prōtotokos) vs. 'first-created' (prōtoktistos) — Paul could have written the latter if he meant Christ was created first. He deliberately chose the title of sovereign heir instead."

    theology:"The universal human experience of dependence ('in him we live and move and have our being') is evidence of the Creator's sustaining presence. Even pagan poets grope toward this truth. Paul uses it not to validate paganism but to show that the God he proclaims is the one all human seeking has been (wrongly) directed away from.",
